<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>푸로찜 에스 음성 입출고</title>

    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 40px 20px;
            background: #f9f9f9;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 30px;
        }

        button {
            font-size: 24px;
            padding: 18px 30px;
            border-radius: 30px;
            border: none;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
            margin: 8px;
        }

        button:disabled {
            background-color: #999;
            cursor: default;
        }

        #stop-btn {
            background-color: #d9534f;
        }

        #stop-btn:disabled {
            background-color: #999;
        }

        #result {
            margin-top: 30px;
            font-size: 18px;
            color: #333;
            white-space: pre-wrap;
            line-height: 1.6;
        }

        .success {
            color: green;
            font-weight: bold;
        }

        .error {
            color: red;
            font-weight: bold;
        }

        .listening {
            color: #1565c0;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>🎙️ 푸로찜 에스<br>음성 입출고 시스템</h1>

    <button id="start-btn">
        🗣️ 말하기 시작
    </button>

    <button id="stop-btn" disabled>
        🛑 말하기 완료
    </button>

    <div id="result">
        버튼을 누르고 말씀하세요.
    </div>


<script>

    // =========================================================
    // ⭐ 사장님의 GAS 웹 앱 주소
    // =========================================================

    const GAS_URL =
        "https://script.google.com/macros/s/AKfycbz6AjeW-CFnV7n9wuv-bfH56zpLx4iT43Q2V9rLWe5-wTEI5eAK72BJjPQzAMPP8DdM/exec";


    // =========================================================
    // ⭐ 음성 입력 설정
    // =========================================================

    // 최대 음성 입력 시간
    // 사장님이 직접 완료 버튼을 누르지 않아도
    // 최대 30초가 지나면 자동으로 완료합니다.
    const MAX_RECORDING_TIME =
        30 * 1000;


    // =========================================================
    // 화면 요소
    // =========================================================

    const startBtn =
        document.getElementById("start-btn");

    const stopBtn =
        document.getElementById("stop-btn");

    const resultDiv =
        document.getElementById("result");


    // =========================================================
    // 휴대폰 음성인식 기능 확인
    // =========================================================

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

        resultDiv.className = "error";

        resultDiv.innerText =
            "❌ 이 브라우저는 음성 인식을 지원하지 않습니다.\n\n" +
            "휴대폰에서는 Chrome을 사용해주세요.";

    } else {


        // =====================================================
        // 🎤 음성인식 객체
        // =====================================================

        const recognition =
            new SpeechRecognition();


        // 한국어
        recognition.lang =
            "ko-KR";


        // ⭐ 중요
        // 한 번의 짧은 문장만 듣는 것이 아니라
        // 계속해서 음성을 받도록 설정합니다.
        recognition.continuous =
            true;


        // 말하는 도중에도 화면에 글자를 보여줍니다.
        recognition.interimResults =
            true;


        // 한 번의 음성인식 세션에서 최대한 많은 결과를 유지
        recognition.maxAlternatives =
            1;


        // =====================================================
        // ⭐ 음성 상태 변수
        // =====================================================

        // 사용자가 현재 녹음 중인지
        let isRecording =
            false;


        // 사용자가 "말하기 완료"를 눌렀는지
        let userFinished =
            false;


        // 최종 확정된 음성 문장
        let finalTranscript =
            "";


        // 현재 말하는 중인 임시 문장
        let interimTranscript =
            "";


        // 자동 종료 방지용 타이머
        let recordingTimer =
            null;


        // 중복 전송 방지
        let isSending =
            false;


        // =====================================================
        // 🎤 화면에 현재 음성 내용 표시
        // =====================================================

        function showTranscript() {

            const fullText =
                (
                    finalTranscript +
                    interimTranscript
                ).trim();


            if (!fullText) {

                resultDiv.innerText =
                    "🎧 듣고 있어요...\n\n" +
                    "편하게 말씀하세요.\n" +
                    "중간에 잠깐 멈춰도 괜찮습니다.";

                return;
            }


            resultDiv.innerText =
                "🎧 듣고 있어요...\n\n" +
                "🗣️ " +
                fullText +
                "\n\n" +
                "말씀을 다 하셨으면\n" +
                "🛑 「말하기 완료」를 눌러주세요.";

        }


        // =====================================================
        // 🎤 음성인식 시작
        // =====================================================

        function startRecognition() {

            if (!isRecording) {
                return;
            }


            try {

                recognition.start();

            } catch (error) {

                /*
                 * 이미 실행 중인 경우에는
                 * 다시 start()를 호출하지 않습니다.
                 *
                 * 음성인식 API 특성상 발생할 수 있는
                 * 중복 시작 오류를 무시합니다.
                 */

                console.log(
                    "음성인식 재시작:",
                    error
                );

            }

        }


        // =====================================================
        // 🗣️ "말하기 시작" 버튼
        // =====================================================

        startBtn.addEventListener(
            "click",
            () => {

                if (isRecording) {
                    return;
                }


                // 상태 초기화
                isRecording =
                    true;

                userFinished =
                    false;

                finalTranscript =
                    "";

                interimTranscript =
                    "";

                isSending =
                    false;


                // 버튼 상태
                startBtn.disabled =
                    true;

                stopBtn.disabled =
                    false;

                startBtn.innerText =
                    "🎧 듣고 있어요...";


                resultDiv.className =
                    "listening";


                resultDiv.innerText =
                    "🎧 듣고 있어요...\n\n" +
                    "편하게 말씀하세요.\n" +
                    "중간에 잠깐 멈춰도 괜찮습니다.\n\n" +
                    "다 말씀하신 후\n" +
                    "🛑 「말하기 완료」를 눌러주세요.";


                // =================================================
                // ⭐ 최대 30초 안전장치
                // =================================================

                clearTimeout(
                    recordingTimer
                );


                recordingTimer =
                    setTimeout(
                        () => {

                            if (isRecording) {

                                finishRecording();

                            }

                        },
                        MAX_RECORDING_TIME
                    );


                // 음성인식 시작
                startRecognition();

            }
        );


        // =====================================================
        // 🛑 "말하기 완료" 버튼
        // =====================================================

        stopBtn.addEventListener(
            "click",
            () => {

                finishRecording();

            }
        );


        // =====================================================
        // 🛑 음성 입력 종료 처리
        // =====================================================

        function finishRecording() {

            if (!isRecording) {
                return;
            }


            // 녹음 상태 종료
            isRecording =
                false;

            userFinished =
                true;


            // 타이머 제거
            clearTimeout(
                recordingTimer
            );


            // 음성인식 중지
            try {

                recognition.stop();

            } catch (error) {

                console.log(
                    "음성인식 종료:",
                    error
                );

            }


            // 버튼 상태
            startBtn.disabled =
                true;

            stopBtn.disabled =
                true;

            startBtn.innerText =
                "📤 전송 중...";


            // 최종 텍스트
            const text =
                finalTranscript.trim();


            // 아무 말도 하지 않은 경우
            if (!text) {

                isSending =
                    false;

                startBtn.disabled =
                    false;

                startBtn.innerText =
                    "🗣️ 다시 말하기";

                resultDiv.className =
                    "error";

                resultDiv.innerText =
                    "❌ 음성 내용이 없습니다.\n\n" +
                    "다시 말해주세요.";

                return;
            }


            // =================================================
            // ⭐ 여기서 딱 한 번만 GAS로 전송
            // =================================================

            sendToGAS(text);

        }


        // =====================================================
        // 🎤 음성 인식 결과
        // =====================================================

        recognition.onresult =
            (event) => {


                // 녹음 중이 아니라면 무시
                if (!isRecording) {
                    return;
                }


                interimTranscript =
                    "";


                for (
                    let i = event.resultIndex;
                    i < event.results.length;
                    i++
                ) {

                    const transcript =
                        event.results[i][0].transcript;


                    // ⭐ 최종 결과
                    if (
                        event.results[i].isFinal
                    ) {

                        finalTranscript +=
                            transcript + " ";

                    }

                    // ⭐ 아직 말하는 중인 임시 결과
                    else {

                        interimTranscript +=
                            transcript;

                    }

                }


                showTranscript();

            };


        // =====================================================
        // 🎤 음성인식이 자동으로 끝났을 때
        // =====================================================

        recognition.onend =
            () => {


                /*
                 * ⭐⭐⭐ 핵심 기능 ⭐⭐⭐
                 *
                 * 휴대폰 브라우저는 continuous=true여도
                 * 잠깐 침묵하면 음성인식을 종료시키는 경우가 있습니다.
                 *
                 * 그래서 사장님이 아직 녹음 중이라면
                 * 자동으로 다시 시작합니다.
                 *
                 * 즉,
                 *
                 * "삼성상사..."
                 *
                 * 잠깐 생각
                 *
                 * "...푸로찜 15KG..."
                 *
                 * 잠깐 생각
                 *
                 * "...3박스 출고"
                 *
                 * 이런 식으로 말해도
                 * 계속 받을 수 있게 합니다.
                 */


                if (
                    isRecording &&
                    !userFinished
                ) {

                    resultDiv.className =
                        "listening";


                    resultDiv.innerText =
                        "🎧 계속 듣고 있어요...\n\n" +
                        "잠깐 멈추셔도 괜찮습니다.";


                    // 아주 짧게 기다렸다가 다시 시작
                    setTimeout(
                        () => {

                            if (
                                isRecording &&
                                !userFinished
                            ) {

                                startRecognition();

                            }

                        },
                        200
                    );


                    return;
                }


                // 사용자가 완료한 경우
                if (userFinished) {

                    startBtn.innerText =
                        "📤 전송 중...";

                }

            };


        // =====================================================
        // ❌ 음성인식 오류
        // =====================================================

        recognition.onerror =
            (event) => {


                console.log(
                    "음성인식 오류:",
                    event.error
                );


                /*
                 * no-speech
                 *
                 * 말을 잠깐 안 했다는 뜻입니다.
                 *
                 * 이 경우는 오류로 처리하지 않고
                 * 다시 듣도록 합니다.
                 */

                if (
                    event.error ===
                    "no-speech"
                ) {

                    if (
                        isRecording &&
                        !userFinished
                    ) {

                        resultDiv.className =
                            "listening";

                        resultDiv.innerText =
                            "🎧 계속 듣고 있어요...\n\n" +
                            "편하게 이어서 말씀하세요.";

                    }

                    return;
                }


                /*
                 * aborted
                 *
                 * 음성인식을 다시 시작하거나
                 * 사용자가 종료했을 때 발생할 수 있습니다.
                 *
                 * 녹음 중이면 무시합니다.
                 */

                if (
                    event.error ===
                    "aborted"
                ) {

                    return;
                }


                // 그 외 진짜 오류
                if (
                    isRecording
                ) {

                    isRecording =
                        false;

                    userFinished =
                        true;

                    clearTimeout(
                        recordingTimer
                    );


                    startBtn.disabled =
                        false;

                    stopBtn.disabled =
                        true;

                    startBtn.innerText =
                        "🗣️ 다시 말하기";


                    resultDiv.className =
                        "error";

                    resultDiv.innerText =
                        "❌ 음성 인식 오류\n\n" +
                        event.error;

                }

            };

    }


    // =========================================================
    // ⭐ GAS로 음성내용 보내기
    // =========================================================

    function sendToGAS(text) {


        // 중복 전송 방지
        if (isSending) {
            return;
        }


        isSending =
            true;


        resultDiv.className =
            "";

        resultDiv.innerText =
            "📝 최종 음성 내용\n\n" +
            text +
            "\n\n" +
            "📤 Google 시트로 보내는 중...";


        /*
         * 중요!
         *
         * application/json을 사용하면 브라우저가
         * CORS 사전 요청(OPTIONS)을 발생시킬 수 있습니다.
         *
         * 그래서 기존과 동일하게
         * text/plain 방식으로 보냅니다.
         */

        fetch(
            GAS_URL,
            {

                method: "POST",

                headers: {
                    "Content-Type":
                        "text/plain;charset=utf-8"
                },

                body: JSON.stringify({
                    text: text
                })

            }
        )

        .then(
            response => {

                return response.text();

            }
        )

        .then(
            data => {

                console.log(
                    "GAS 응답:",
                    data
                );


                resultDiv.className =
                    "success";


                resultDiv.innerText =
                    "✅ 전송 성공!\n\n" +
                    "🗣️ " +
                    text +
                    "\n\n" +
                    "📊 Google 시트에 저장을 요청했습니다.";


                // 다시 말하기 버튼
                startBtn.disabled =
                    false;

                startBtn.innerText =
                    "🗣️ 다시 말하기";

            }
        )

        .catch(
            error => {

                console.error(
                    "GAS 전송 오류:",
                    error
                );


                /*
                 * 여기서는 무조건
                 * '전송완료'라고 거짓말하지 않습니다.
                 */

                resultDiv.className =
                    "error";


                resultDiv.innerText =
                    "⚠️ 전송 결과를 확인하지 못했습니다.\n\n" +
                    "잠시 후 Google 시트를 확인해주세요.";


                // 다시 말하기 버튼
                startBtn.disabled =
                    false;

                startBtn.innerText =
                    "🗣️ 다시 말하기";

            }
        );

    }

</script>

</body>
</html>
