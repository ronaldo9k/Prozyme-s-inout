<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>푸로찜 에스 음성 입출고 시스템</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f5f6f8;
      color: #222;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      line-height: 1.5;
      margin: 20px 0 25px;
      font-size: 27px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 18px;

      box-shadow:
        0 4px 15px rgba(0,0,0,0.08);
    }

    button {
      width: 100%;
      border: none;
      border-radius: 15px;

      padding: 18px;

      font-size: 20px;
      font-weight: 700;

      cursor: pointer;

      margin-top: 10px;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #startButton {
      background: #222;
      color: white;
    }

    #finishButton {
      background: #d93025;
      color: white;
    }

    #confirmButton {
      background: #188038;
      color: white;
    }

    #retryButton {
      background: #666;
      color: white;
    }

    #result {
      line-height: 1.7;
      font-size: 17px;
    }

    .listening {
      color: #d93025;
      font-weight: 700;
    }

    .success {
      color: #188038;
      font-weight: 700;
    }

    .error {
      color: #d93025;
      font-weight: 700;
    }

    .preview-title {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 18px;
    }

    /* ============================================================
       수정 가능한 입력칸
       ============================================================ */

    .edit-row {
      margin-bottom: 16px;
    }

    .edit-label {
      display: block;

      color: #555;

      font-size: 14px;
      font-weight: 700;

      margin-bottom: 7px;
    }

    .edit-input,
    .edit-select {
      width: 100%;

      padding: 14px;

      border:
        1px solid #d9dce1;

      border-radius: 12px;

      background: white;

      font-size: 17px;

      outline: none;
    }

    .edit-input:focus,
    .edit-select:focus {
      border-color: #188038;
    }

    .size-display {
      background: #f5f6f8;
      color: #555;
      cursor: not-allowed;
    }

    .help-text {
      margin-top: 5px;

      font-size: 13px;
      color: #777;
    }

    .original-text {
      background: #f5f6f8;

      padding: 15px;

      border-radius: 12px;

      margin-top: 18px;

      font-size: 16px;

      line-height: 1.6;
    }

    .button-group {
      margin-top: 20px;
    }

    .timer {
      text-align: center;

      font-size: 15px;

      color: #777;

      margin-top: 10px;
    }

    .loading {
      text-align: center;

      padding: 10px 0;

      color: #555;

      font-weight: 700;
    }

  </style>
</head>


<body>

<div class="container">

  <h1>
    🎙️ 푸로찜 에스<br>
    음성 입출고 시스템
  </h1>


  <!-- ============================================================
       음성 입력 카드
       ============================================================ -->

  <div class="card">

    <button
      id="startButton"
    >
      🗣️ 말하기 시작
    </button>


    <button
      id="finishButton"
      disabled
    >
      🛑 말하기 완료
    </button>


    <div
      id="timer"
      class="timer"
    ></div>

  </div>


  <!-- ============================================================
       결과 카드
       ============================================================ -->

  <div
    id="resultCard"
    class="card"
  >

    <div id="result">
      버튼을 누르고 말씀해주세요.
    </div>

  </div>

</div>


<script>


// ============================================================================
// ⭐ 1. GAS 주소
// ============================================================================

const GAS_URL =
  "https://script.google.com/macros/s/AKfycbzleidiCByBcNPPjRf2Ep-ghgP5BXcrMn4FkfoFzFSk2LJBXKBr2PUGy0g-YZZ3ab-L/exec";


// ============================================================================
// ⭐ 2. 음성인식
// ============================================================================

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (!SpeechRecognition) {

  document.getElementById("result").innerHTML =
    '<div class="error">' +
    '❌ 이 브라우저에서는 음성인식을 지원하지 않습니다.<br><br>' +
    '삼성 인터넷 또는 Chrome을 사용해주세요.' +
    '</div>';

}


// ============================================================================
// ⭐ 3. 상태 변수
// ============================================================================

let recognition = null;

let isRecording = false;

let finishRequested = false;

let recognitionRunning = false;

let finalTranscript = "";

let interimTranscript = "";

let displayedTranscript = "";

let recordingTimer = null;

let isSending = false;


// ⭐ 확인 대기 토큰

let pendingToken = null;


// ⭐ GAS에서 받아온 거래처 / 제품 목록

let clientList = [];

let productList = [];


// ⭐⭐⭐⭐⭐ 이번에 추가
// Notion Select 옵션 목록

let deliveryTypeList = [];

let secondDeliveryLocationList = [];


// ============================================================================
// ⭐ 4. DOM
// ============================================================================

const startButton =
  document.getElementById(
    "startButton"
  );

const finishButton =
  document.getElementById(
    "finishButton"
  );

const result =
  document.getElementById(
    "result"
  );

const timer =
  document.getElementById(
    "timer"
  );


// ============================================================================
// 🧹 5. 텍스트 정리
// ============================================================================

function cleanText(text) {

  return String(text || "")
    .replace(/\s+/g, " ")
    .trim();

}


// ============================================================================
// 🧹 6. 중복 문장 방지
// ============================================================================

function appendWithoutDuplicate(
  current,
  addition
) {

  addition =
    cleanText(addition);


  if (!addition) {
    return current;
  }


  if (!current) {
    return addition;
  }


  if (
    current === addition
  ) {

    return current;

  }


  if (
    current.includes(addition)
  ) {

    return current;

  }


  if (
    addition.includes(current)
  ) {

    return addition;

  }


  return (
    current +
    " " +
    addition
  );

}


// ============================================================================
// 👀 7. 현재 음성 화면
// ============================================================================

function showCurrentText() {

  const finalText =
    cleanText(
      finalTranscript
    );


  const interimText =
    cleanText(
      interimTranscript
    );


  displayedTranscript =
    cleanText(
      finalText +
      (
        interimText
          ? " " + interimText
          : ""
      )
    );


  result.innerHTML =
    '<div class="listening">' +
    '🎙️ 듣고 있어요...<br><br>' +
    '</div>' +

    escapeHtml(
      displayedTranscript ||
      "말씀해주세요."
    );

}


// ============================================================================
// 🎙️ 8. 음성인식 시작
// ============================================================================

function startRecognition() {

  if (!SpeechRecognition) {
    return;
  }


  if (!recognition) {
    return;
  }


  if (recognitionRunning) {
    return;
  }


  try {

    recognition.start();

  } catch (error) {

    console.log(
      "recognition.start 오류:",
      error
    );

  }

}


// ============================================================================
// 🟢 9. 말하기 시작 / 이어서 말하기
// ============================================================================

startButton.addEventListener(
  "click",
  function() {

    if (isSending) {
      return;
    }


    if (!SpeechRecognition) {
      return;
    }


    // ========================================================================
    // ⭐ 이어서 말하기
    // ========================================================================

    if (isRecording) {

      finishRequested =
        false;


      startButton.disabled =
        true;


      finishButton.disabled =
        false;


      result.innerHTML =
        '<div class="listening">' +
        '🎙️ 다시 듣고 있어요...<br><br>' +
        '</div>' +

        (
          displayedTranscript
            ? escapeHtml(
                displayedTranscript
              )
            : '말씀해주세요.'
        );


      startRecognition();


      return;

    }


    // ========================================================================
    // ⭐ 새로운 녹음
    // ========================================================================

    pendingToken =
      null;


    finalTranscript =
      "";

    interimTranscript =
      "";

    displayedTranscript =
      "";

    finishRequested =
      false;

    isRecording =
      true;


    startButton.disabled =
      true;


    finishButton.disabled =
      false;


    startButton.textContent =
      "🎤 듣는 중";


    timer.textContent =
      "⏱️ 최대 30초";


    result.innerHTML =
      '<div class="listening">' +
      '🎙️ 듣고 있어요...<br><br>' +
      '말씀해주세요.' +
      '</div>';


    // ------------------------------------------------------------------------
    // ⭐ 음성인식 객체
    // ------------------------------------------------------------------------

    recognition =
      new SpeechRecognition();


    recognition.lang =
      "ko-KR";


    recognition.continuous =
      true;


    recognition.interimResults =
      true;


    recognition.maxAlternatives =
      1;


    // ------------------------------------------------------------------------
    // 🎙️ 음성 결과
    // ------------------------------------------------------------------------

    recognition.onresult =
      function(event) {

        let newFinal = "";

        let newInterim = "";


        for (
          let i = event.resultIndex;
          i < event.results.length;
          i++
        ) {

          const transcript =
            cleanText(
              event.results[i][0].transcript
            );


          if (
            event.results[i].isFinal
          ) {

            newFinal =
              appendWithoutDuplicate(
                newFinal,
                transcript
              );

          } else {

            newInterim =
              appendWithoutDuplicate(
                newInterim,
                transcript
              );

          }

        }


        if (newFinal) {

          finalTranscript =
            appendWithoutDuplicate(
              finalTranscript,
              newFinal
            );

        }


        interimTranscript =
          newInterim;


        showCurrentText();

      };


    // ------------------------------------------------------------------------
    // 🛑 음성인식 종료
    // ------------------------------------------------------------------------

    recognition.onend =
      function() {

        recognitionRunning =
          false;


        if (
          isRecording &&
          !finishRequested
        ) {

          startButton.disabled =
            false;


          startButton.textContent =
            "🎤 이어서 말하기";


          finishButton.disabled =
            false;


          if (displayedTranscript) {

            result.innerHTML =
              escapeHtml(
                displayedTranscript
              );

          }

        }

      };


    // ------------------------------------------------------------------------
    // ⚠️ 음성인식 오류
    // ------------------------------------------------------------------------

    recognition.onerror =
      function(event) {

        console.log(
          "음성인식 오류:",
          event.error
        );


        recognitionRunning =
          false;


        if (
          event.error ===
          "not-allowed"
        ) {

          result.innerHTML =
            '<div class="error">' +
            '❌ 마이크 사용이 차단되었습니다.<br><br>' +
            '브라우저 주소창의 마이크 권한을 허용해주세요.' +
            '</div>';


          isRecording =
            false;


          finishRequested =
            true;


          startButton.disabled =
            false;


          startButton.textContent =
            "🗣️ 말하기 시작";


          finishButton.disabled =
            true;


          return;

        }


        if (
          event.error ===
          "no-speech"
        ) {

          return;

        }


        if (
          event.error ===
          "aborted"
        ) {

          return;

        }

      };


    // ------------------------------------------------------------------------
    // 🟢 실제 시작
    // ------------------------------------------------------------------------

    recognition.onstart =
      function() {

        recognitionRunning =
          true;

      };


    startRecognition();


    // ------------------------------------------------------------------------
    // ⏱️ 최대 30초
    // ------------------------------------------------------------------------

    clearTimeout(
      recordingTimer
    );


    recordingTimer =
      setTimeout(
        function() {

          if (isRecording) {

            finishRecording();

          }

        },
        30000
      );

  }
);


// ============================================================================
// 🛑 10. 말하기 완료
// ============================================================================

finishButton.addEventListener(
  "click",
  function() {

    finishRecording();

  }
);


// ============================================================================
// 🛑 11. 녹음 종료
// ============================================================================

function finishRecording() {

  if (!isRecording) {
    return;
  }


  isRecording =
    false;


  finishRequested =
    true;


  clearTimeout(
    recordingTimer
  );


  if (recognition) {

    try {

      recognition.stop();

    } catch (error) {

      console.log(
        "recognition.stop 오류:",
        error
      );

    }

  }


  recognitionRunning =
    false;


  startButton.disabled =
    false;


  startButton.textContent =
    "🗣️ 말하기 시작";


  finishButton.disabled =
    true;


  timer.textContent =
    "";


  const text =
    cleanText(
      finalTranscript ||
      displayedTranscript
    );


  if (!text) {

    result.innerHTML =
      '<div class="error">' +
      '❌ 음성 내용을 듣지 못했어요.<br><br>' +
      '다시 말해주세요.' +
      '</div>';


    return;

  }


  finalizeAndSend(
    text
  );

}


// ============================================================================
// 📡 12. 분석 요청
// ============================================================================

function finalizeAndSend(
  text
) {

  if (isSending) {
    return;
  }


  isSending =
    true;


  result.innerHTML =
    '<div class="listening">' +
    '🔎 음성을 분석하고 있어요...<br><br>' +
    '잠시만 기다려주세요.' +
    '</div>';


  sendAnalyzeToGAS(
    text
  );

}


// ============================================================================
// 📡 13. GAS POST 공통
// ============================================================================

async function postToGAS(
  payload
) {

  const response =
    await fetch(
      GAS_URL,
      {

        method:
          "POST",

        headers: {

          "Content-Type":
            "text/plain;charset=utf-8"

        },

        body:
          JSON.stringify(
            payload
          )

      }
    );


  const raw =
    await response.text();


  console.log(
    "GAS 응답:",
    raw
  );


  let data;


  try {

    data =
      JSON.parse(
        raw
      );

  } catch (jsonError) {

    throw new Error(
      "GAS 응답을 읽지 못했습니다.\n\n" +
      raw
    );

  }


  return data;

}


// ============================================================================
// 📡 14. GAS 분석 요청
// ============================================================================

async function sendAnalyzeToGAS(
  text
) {

  try {

    const data =
      await postToGAS({

        action:
          "analyze",

        text:
          text

      });


    if (
      data.status !==
      "preview"
    ) {

      throw new Error(
        data.message ||
        "음성 분석에 실패했습니다."
      );

    }


    // ------------------------------------------------------------------------
    // ⭐ 확인 토큰
    // ------------------------------------------------------------------------

    pendingToken =
      data.token;


    // ------------------------------------------------------------------------
    // ⭐ 미리보기
    // ------------------------------------------------------------------------

    showPreview(
      data
    );


  } catch (error) {

    console.error(
      error
    );


    result.innerHTML =
      '<div class="error">' +
      '❌ 분석하지 못했어요.<br><br>' +
      escapeHtml(
        error.message ||
        String(error)
      ) +
      '</div>' +

      '<div class="button-group">' +

      '<button ' +
      'id="retryButton"' +
      'style="background:#666;color:white;"' +
      '>' +
      '❌ 다시 말하기' +
      '</button>' +

      '</div>';


    const retryButton =
      document.getElementById(
        "retryButton"
      );


    retryButton.addEventListener(
      "click",
      function() {

        resetForNewRecording();

      }
    );


  } finally {

    isSending =
      false;

  }

}


// ============================================================================
// 📋 15. 초기 거래처 / 제품 / Select 목록
// ============================================================================

async function loadInitialData() {

  try {

    const data =
      await postToGAS({

        action:
          "initialData"

      });


    if (
      data.status !==
      "success"
    ) {

      throw new Error(
        data.message ||
        "초기 데이터를 가져오지 못했습니다."
      );

    }


    clientList =
      Array.isArray(data.clients)
        ? data.clients
        : [];


    productList =
      Array.isArray(data.products)
        ? data.products
        : [];


    // ========================================================================
    // ⭐ 납품형태 Select
    // ========================================================================

    deliveryTypeList =
      Array.isArray(
        data.deliveryTypes
      )
        ? data.deliveryTypes
        : [];


    // ========================================================================
    // ⭐ 제2배송지 Select
    // ========================================================================

    secondDeliveryLocationList =
      Array.isArray(
        data.secondDeliveryLocations
      )
        ? data.secondDeliveryLocations
        : [];


    console.log(
      "거래처 수:",
      clientList.length
    );


    console.log(
      "제품 수:",
      productList.length
    );


    console.log(
      "납품형태 옵션:",
      deliveryTypeList
    );


    console.log(
      "제2배송지 옵션:",
      secondDeliveryLocationList
    );


  } catch (error) {

    console.error(
      "초기 데이터 오류:",
      error
    );


    result.innerHTML =
      '<div class="error">' +
      '❌ 거래처 / 제품 목록을 가져오지 못했습니다.<br><br>' +
      escapeHtml(
        error.message ||
        String(error)
      ) +
      '</div>';

  }

}


// ============================================================================
// 👀 16. 미리보기 화면
// ============================================================================
//
// 기존:
//
// 거래처
// 제품
// 규격
// 수량
// 입출고
// 납품요청일
//
// ⭐ 추가:
//
// 납품형태
// 제2배송지
//
// ============================================================================

function showPreview(
  data
) {

  // --------------------------------------------------------------------------
  // 거래처 옵션
  // --------------------------------------------------------------------------

  let clientOptions =
    "";


  clientList.forEach(
    function(client) {

      const selected =
        String(client.id) ===
        String(data.clientPageId)
          ? " selected"
          : "";


      clientOptions +=
        '<option value="' +
        escapeAttribute(
          client.id
        ) +
        '"' +
        selected +
        '>' +

        escapeHtml(
          client.name
        ) +

        '</option>';

    }
  );


  // --------------------------------------------------------------------------
  // 제품 옵션
  // --------------------------------------------------------------------------

  let productOptions =
    "";


  productList.forEach(
    function(product) {

      const selected =
        String(product.id) ===
        String(data.productPageId)
          ? " selected"
          : "";


      productOptions +=
        '<option value="' +
        escapeAttribute(
          product.id
        ) +
        '"' +
        selected +
        '>' +

        escapeHtml(
          product.name
        ) +

        '</option>';

    }
  );


  // ==========================================================================
// ⭐ 납품형태 옵션
// ==========================================================================
//
// 기본값 = 직송
//
// Notion에 실제 존재하는 옵션만 표시합니다.
// ==========================================================================

  let deliveryTypeOptions =
    "";


  deliveryTypeList.forEach(
    function(option) {

      const selected =
        option === "직송"
          ? " selected"
          : "";


      deliveryTypeOptions +=

        '<option value="' +
        escapeAttribute(
          option
        ) +
        '"' +
        selected +
        '>' +

        escapeHtml(
          option
        ) +

        '</option>';

    }
  );


  // ==========================================================================
// ⭐ 제2배송지 옵션
// ==========================================================================
//
// 기본값 = 빈 값
//
// ==========================================================================

  let secondDeliveryOptions =

    '<option value="" selected>' +
    '선택 안 함' +
    '</option>';


  secondDeliveryLocationList.forEach(
    function(option) {

      secondDeliveryOptions +=

        '<option value="' +
        escapeAttribute(
          option
        ) +
        '">' +

        escapeHtml(
          option
        ) +

        '</option>';

    }
  );


  // --------------------------------------------------------------------------
  // HTML
  // --------------------------------------------------------------------------

  const html =

    '<div class="preview-title">' +
    '📝 등록 내용을 확인해주세요' +
    '</div>' +


    // ========================================================================
    // 거래처
    // ========================================================================

    '<div class="edit-row">' +

    '<label class="edit-label">' +
    '🏢 거래처' +
    '</label>' +

    '<select ' +
    'id="clientSelect" ' +
    'class="edit-select"' +
    '>' +

    clientOptions +

    '</select>' +

    '</div>' +


    // ========================================================================
    // 제품
    // ========================================================================

    '<div class="edit-row">' +

    '<label class="edit-label">' +
    '🏭 제품' +
    '</label>' +

    '<select ' +
    'id="productSelect" ' +
    'class="edit-select"' +
    '>' +

    productOptions +

    '</select>' +

    '</div>' +


    // ========================================================================
    // 규격
    // ========================================================================

    '<div class="edit-row">' +

    '<label class="edit-label">' +
    '📏 규격' +
    '</label>' +

    '<input ' +
    'id="sizeInput" ' +
    'class="edit-input size-display"' +
    'value="' +
    escapeAttribute(
      data.size
    ) +
    '" ' +
    'readonly' +
    '>' +

    '<div class="help-text">' +
    '제품을 바꾸면 규격도 자동으로 바뀝니다.' +
    '</div>' +

    '</div>' +


    // ========================================================================
    // 수량
    // ========================================================================

    '<div class="edit-row">' +

    '<label class="edit-label">' +
    '📦 수량' +
    '</label>' +

    '<input ' +
    'id="quantityInput" ' +
    'class="edit-input"' +
    'type="number" ' +
    'min="1" ' +
    'step="1" ' +
    'value="' +
    escapeAttribute(
      data.quantity
    ) +
    '"' +
    '>' +

    '<div class="help-text">' +
    '박스 수량을 숫자로 수정하세요.' +
    '</div>' +

    '</div>' +


    // ========================================================================
    // 입출고
    // ========================================================================

    '<div class="edit-row">' +

    '<label class="edit-label">' +
    '📤 입출고' +
    '</label>' +

    '<select ' +
    'id="modeSelect" ' +
    'class="edit-select"' +
    '>' +

    '<option value="출고"' +
    (
      data.mode === "출고"
        ? " selected"
        : ""
    ) +
    '>출고</option>' +

    '<option value="입고"' +
    (
      data.mode === "입고"
        ? " selected"
        : ""
    ) +
    '>입고</option>' +

    '</select>' +

    '</div>' +


    // ========================================================================
    // 납품요청일
    // ========================================================================

    '<div class="edit-row">' +

    '<label class="edit-label">' +
    '📅 납품요청일' +
    '</label>' +

    '<input ' +
    'id="deliveryDateInput" ' +
    'class="edit-input"' +
    'type="date" ' +
    'value="' +
    escapeAttribute(
      data.deliveryDate
    ) +
    '"' +
    '>' +

    '</div>' +


    // ========================================================================
    // ⭐⭐⭐⭐⭐ 납품형태
    // ========================================================================

    '<div class="edit-row">' +

    '<label class="edit-label">' +
    '🚚 납품형태' +
    '</label>' +

    '<select ' +
    'id="deliveryTypeSelect" ' +
    'class="edit-select"' +
    '>' +

    deliveryTypeOptions +

    '</select>' +

    '<div class="help-text">' +
    '기본값은 "직송"입니다. 필요하면 직접 변경하세요.' +
    '</div>' +

    '</div>' +


    // ========================================================================
    // ⭐⭐⭐⭐⭐ 제2배송지
    // ========================================================================

    '<div class="edit-row">' +

    '<label class="edit-label">' +
    '📍 제2배송지' +
    '</label>' +

    '<select ' +
    'id="secondDeliverySelect" ' +
    'class="edit-select"' +
    '>' +

    secondDeliveryOptions +

    '</select>' +

    '<div class="help-text">' +
    '필요할 때만 선택하세요. 기본값은 빈 값입니다.' +
    '</div>' +

    '</div>' +


    // ========================================================================
    // 원문
    // ========================================================================

    '<div class="original-text">' +

    '<strong>🗣 내가 말한 원문</strong>' +

    '<br><br>' +

    escapeHtml(
      data.text
    ) +

    '</div>' +


    // ========================================================================
    // 버튼
    // ========================================================================

    '<div class="button-group">' +

    '<button ' +
    'id="confirmButton"' +
    '>' +

    '✅ 수정된 내용으로 Notion 등록' +

    '</button>' +


    '<button ' +
    'id="retryButton"' +
    'style="background:#666;color:white;"' +
    '>' +

    '❌ 다시 말하기' +

    '</button>' +

    '</div>';


  result.innerHTML =
    html;


  // --------------------------------------------------------------------------
  // ⭐ 제품 변경 → 규격 자동 변경
  // --------------------------------------------------------------------------

  const productSelect =
    document.getElementById(
      "productSelect"
    );


  const sizeInput =
    document.getElementById(
      "sizeInput"
    );


  if (productSelect) {

    productSelect.addEventListener(
      "change",
      function() {

        const selectedProduct =
          productList.find(
            function(product) {

              return String(product.id) ===
                String(
                  productSelect.value
                );

            }
          );


        if (!selectedProduct) {
          return;
        }


        const size =
          getProductSize(
            selectedProduct.name
          );


        if (size) {

          sizeInput.value =
            size;

        }

      }
    );

  }


  // --------------------------------------------------------------------------
  // ⭐ 확인 버튼
  // --------------------------------------------------------------------------

  document
    .getElementById(
      "confirmButton"
    )
    .addEventListener(
      "click",
      function() {

        confirmNotionRegistration();

      }
    );


  // --------------------------------------------------------------------------
  // ⭐ 다시 말하기
  // --------------------------------------------------------------------------

  document
    .getElementById(
      "retryButton"
    )
    .addEventListener(
      "click",
      function() {

        resetForNewRecording();

      }
    );

}


// ============================================================================
// 📏 17. 제품명에서 규격 찾기
// ============================================================================

function getProductSize(
  productName
) {

  const text =
    String(
      productName || ""
    );


  if (
    /12\s*KG/i.test(text)
  ) {

    return "12 KG";

  }


  if (
    /15\s*KG/i.test(text)
  ) {

    return "15 KG";

  }


  if (
    /20\s*KG/i.test(text)
  ) {

    return "20 KG";

  }


  return "";

}


// ============================================================================
// 🔐 18. 사용자가 최종 확인 → Notion 등록
// ============================================================================

async function confirmNotionRegistration() {

  if (
    !pendingToken
  ) {

    result.innerHTML =
      '<div class="error">' +
      '❌ 확인 시간이 만료되었어요.<br><br>' +
      '다시 말씀해주세요.' +
      '</div>';


    return;

  }


  if (isSending) {
    return;
  }


  // --------------------------------------------------------------------------
  // 화면에서 수정한 값 읽기
  // --------------------------------------------------------------------------

  const clientSelect =
    document.getElementById(
      "clientSelect"
    );


  const productSelect =
    document.getElementById(
      "productSelect"
    );


  const quantityInput =
    document.getElementById(
      "quantityInput"
    );


  const modeSelect =
    document.getElementById(
      "modeSelect"
    );


  const deliveryDateInput =
    document.getElementById(
      "deliveryDateInput"
    );


  const sizeInput =
    document.getElementById(
      "sizeInput"
    );


  // ⭐⭐⭐⭐⭐ 새 Select

  const deliveryTypeSelect =
    document.getElementById(
      "deliveryTypeSelect"
    );


  const secondDeliverySelect =
    document.getElementById(
      "secondDeliverySelect"
    );


  if (
    !clientSelect ||
    !productSelect ||
    !quantityInput ||
    !modeSelect ||
    !deliveryDateInput ||
    !sizeInput ||
    !deliveryTypeSelect ||
    !secondDeliverySelect
  ) {

    result.innerHTML =
      '<div class="error">' +
      '❌ 등록 화면을 읽지 못했습니다.<br><br>' +
      '다시 말씀해주세요.' +
      '</div>';


    return;

  }


  const clientPageId =
    clientSelect.value;


  const productPageId =
    productSelect.value;


  const quantity =
    Number(
      quantityInput.value
    );


  const mode =
    modeSelect.value;


  const deliveryDate =
    deliveryDateInput.value;


  const size =
    sizeInput.value;


  // ==========================================================================
// ⭐ 납품형태
// ==========================================================================

  const deliveryType =
    deliveryTypeSelect.value;


  // ==========================================================================
// ⭐ 제2배송지
// ==========================================================================

  const secondDeliveryLocation =
    secondDeliverySelect.value;


  // --------------------------------------------------------------------------
  // 기본 검사
  // --------------------------------------------------------------------------

  if (!clientPageId) {

    alert(
      "거래처를 선택해주세요."
    );

    return;

  }


  if (!productPageId) {

    alert(
      "제품을 선택해주세요."
    );

    return;

  }


  if (
    !Number.isInteger(quantity) ||
    quantity <= 0
  ) {

    alert(
      "수량은 1박스 이상의 정수로 입력해주세요."
    );

    quantityInput.focus();

    return;

  }


  if (
    mode !== "입고" &&
    mode !== "출고"
  ) {

    alert(
      "입고 또는 출고를 선택해주세요."
    );

    return;

  }


  if (
    !/^\d{4}-\d{2}-\d{2}$/.test(
      deliveryDate
    )
  ) {

    alert(
      "납품요청일을 선택해주세요."
    );

    deliveryDateInput.focus();

    return;

  }


  if (
    size !== "12 KG" &&
    size !== "15 KG" &&
    size !== "20 KG"
  ) {

    alert(
      "제품 규격을 확인해주세요."
    );

    return;

  }


  // ==========================================================================
// ⭐ 납품형태 검사
// ==========================================================================

  if (!deliveryType) {

    alert(
      "납품형태를 선택해주세요."
    );

    deliveryTypeSelect.focus();

    return;

  }


  // --------------------------------------------------------------------------
  // 전송 중
  // --------------------------------------------------------------------------

  isSending =
    true;


  const confirmButton =
    document.getElementById(
      "confirmButton"
    );


  const retryButton =
    document.getElementById(
      "retryButton"
    );


  if (confirmButton) {

    confirmButton.disabled =
      true;

    confirmButton.textContent =
      "⏳ 노션에 등록 중...";

  }


  if (retryButton) {

    retryButton.disabled =
      true;

  }


  result.innerHTML =
    '<div class="listening">' +
    '📝 노션에 등록하고 있어요...<br><br>' +
    '잠시만 기다려주세요.' +
    '</div>';


  try {

    // ------------------------------------------------------------------------
    // ⭐ 수정된 최종값을 GAS로 전송
    // ------------------------------------------------------------------------

    const data =
      await postToGAS({

        action:
          "confirm",

        token:
          pendingToken,

        clientPageId:
          clientPageId,

        productPageId:
          productPageId,

        quantity:
          quantity,

        mode:
          mode,

        size:
          size,

        deliveryDate:
          deliveryDate,

        // ⭐⭐⭐⭐⭐ 새 값

        deliveryType:
          deliveryType,

        secondDeliveryLocation:
          secondDeliveryLocation

      });


    // ------------------------------------------------------------------------
    // ❌ 등록 실패
    // ------------------------------------------------------------------------

    if (
      data.status !==
      "success"
    ) {

      throw new Error(
        data.message ||
        "Notion 등록에 실패했습니다."
      );

    }


    // ------------------------------------------------------------------------
    // 🎉 성공
    // ------------------------------------------------------------------------

    pendingToken =
      null;


    result.innerHTML =

      '<div class="success">' +

      '🎉 노션 등록 완료!' +

      '</div>' +

      '<br>' +

      '<strong>' +

      escapeHtml(
        data.clientName
      ) +

      '</strong>' +

      ' / ' +

      escapeHtml(
        data.productName
      ) +

      ' / ' +

      escapeHtml(
        String(
          data.quantity
        ) +
        "박스"
      ) +

      ' / ' +

      escapeHtml(
        data.mode
      ) +

      '<br><br>' +

      '📏 규격: ' +

      escapeHtml(
        data.size
      ) +

      '<br>' +

      '📅 납품요청일: ' +

      escapeHtml(
        data.deliveryDate
      ) +

      '<br>' +

      '🚚 납품형태: ' +

      escapeHtml(
        data.deliveryType ||
        ''
      ) +

      '<br>' +

      '📍 제2배송지: ' +

      escapeHtml(
        data.secondDeliveryLocation ||
        '없음'
      );


    // ------------------------------------------------------------------------
    // Notion 페이지 링크
    // ------------------------------------------------------------------------

    if (
      data.notionUrl
    ) {

      result.innerHTML +=

        '<br><br>' +

        '<a ' +
        'href="' +
        escapeAttribute(
          data.notionUrl
        ) +
        '" ' +
        'target="_blank" ' +
        'style="font-size:16px;"' +
        '>' +

        '🔗 노션 페이지 열기' +

        '</a>';

    }


    // ------------------------------------------------------------------------
    // 새 입력 버튼
    // ------------------------------------------------------------------------

    result.innerHTML +=

      '<div class="button-group">' +

      '<button ' +
      'id="newRecordButton"' +
      'style="background:#222;color:white;"' +
      '>' +

      '🎙️ 새 입출고 말하기' +

      '</button>' +

      '</div>';


    document
      .getElementById(
        "newRecordButton"
      )
      .addEventListener(
        "click",
        function() {

          resetForNewRecording();

        }
      );


  } catch (error) {

    console.error(
      error
    );


    result.innerHTML =

      '<div class="error">' +

      '❌ 노션 등록에 실패했어요.' +

      '<br><br>' +

      escapeHtml(
        error.message ||
        String(error)
      ) +

      '</div>' +

      '<div class="button-group">' +

      '<button ' +
      'id="retryButton"' +
      'style="background:#666;color:white;"' +
      '>' +

      '🔄 다시 말하기' +

      '</button>' +

      '</div>';


    document
      .getElementById(
        "retryButton"
      )
      .addEventListener(
        "click",
        function() {

          resetForNewRecording();

        }
      );

  } finally {

    isSending =
      false;

  }

}


// ============================================================================
// 🔄 19. 새 음성 입력 준비
// ============================================================================

function resetForNewRecording() {

  clearTimeout(
    recordingTimer
  );


  if (
    recognition
  ) {

    try {

      recognition.stop();

    } catch (error) {

      console.log(
        error
      );

    }

  }


  isRecording =
    false;


  finishRequested =
    true;


  recognitionRunning =
    false;


  finalTranscript =
    "";

  interimTranscript =
    "";

  displayedTranscript =
    "";


  pendingToken =
    null;


  isSending =
    false;


  startButton.disabled =
    false;


  startButton.textContent =
    "🗣️ 말하기 시작";


  finishButton.disabled =
    true;


  timer.textContent =
    "";


  result.innerHTML =
    "버튼을 누르고 말씀해주세요.";

}


// ============================================================================
// 🛡️ 20. HTML 안전 처리
// ============================================================================

function escapeHtml(
  value
) {

  return String(
    value == null
      ? ""
      : value
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeAttribute(
  value
) {

  return escapeHtml(
    value
  );

}


// ============================================================================
// ⭐ 21. 페이지 처음 열렸을 때
// ============================================================================
//
// GitHub 페이지가 열리면
//
// 거래처
// 제품
// 납품형태 Select
// 제2배송지 Select
//
// 를 GAS → Notion에서 가져옵니다.
// ============================================================================

loadInitialData();


</script>
