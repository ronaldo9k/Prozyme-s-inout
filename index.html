<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>푸로찜 에스 음성 입출고 시스템</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f5f6f8;
      color: #222;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      line-height: 1.5;
      margin: 20px 0 25px;
      font-size: 27px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow:
        0 4px 15px rgba(0,0,0,0.08);
    }

    button {
      width: 100%;
      border: none;
      border-radius: 15px;
      padding: 18px;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #startButton {
      background: #222;
      color: white;
    }

    #finishButton {
      background: #d93025;
      color: white;
    }

    #confirmButton {
      background: #188038;
      color: white;
    }

    #retryButton {
      background: #666;
      color: white;
    }

    #result {
      white-space: pre-wrap;
      line-height: 1.7;
      font-size: 17px;
    }

    .listening {
      color: #d93025;
      font-weight: 700;
    }

    .success {
      color: #188038;
      font-weight: 700;
    }

    .error {
      color: #d93025;
      font-weight: 700;
    }

    .preview-title {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .preview-row {
      padding: 13px 0;
      border-bottom: 1px solid #eee;
    }

    .preview-label {
      color: #777;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .preview-value {
      font-size: 19px;
      font-weight: 700;
    }

    .original-text {
      background: #f5f6f8;
      padding: 15px;
      border-radius: 12px;
      margin-top: 15px;
      font-size: 16px;
    }

    .button-group {
      margin-top: 20px;
    }

    .timer {
      text-align: center;
      font-size: 15px;
      color: #777;
      margin-top: 10px;
    }

  </style>
</head>

<body>

<div class="container">

  <h1>
    🎙️ 푸로찜 에스<br>
    음성 입출고 시스템
  </h1>


  <!-- ============================================================
       음성 입력 카드
       ============================================================ -->

  <div class="card">

    <button
      id="startButton"
    >
      🗣️ 말하기 시작
    </button>

    <button
      id="finishButton"
      disabled
    >
      🛑 말하기 완료
    </button>

    <div
      id="timer"
      class="timer"
    ></div>

  </div>


  <!-- ============================================================
       결과 카드
       ============================================================ -->

  <div
    id="resultCard"
    class="card"
  >

    <div id="result">
      버튼을 누르고 말씀해주세요.
    </div>

  </div>

</div>


<script>


// ============================================================================
// ⭐ 1. GAS 주소
// ============================================================================

const GAS_URL =
  "https://script.google.com/macros/s/AKfycbwVx8NHLQCHkC7jJgn4CXrpLqfaJrNY-iSA-pTIB6WV5R1PtBzRoHCHH9mfrl2K0Rmr/exec";


// ============================================================================
// ⭐ 2. 음성인식 기본 설정
// ============================================================================

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

if (!SpeechRecognition) {

  document.getElementById("result").innerHTML =
    '<div class="error">' +
    '❌ 이 브라우저에서는 음성인식을 지원하지 않습니다.<br><br>' +
    '삼성 인터넷 또는 Chrome을 사용해주세요.' +
    '</div>';

}


// ============================================================================
// ⭐ 3. 상태 변수
// ============================================================================

let recognition = null;

let isRecording = false;

let finishRequested = false;

let recognitionRunning = false;

let finalTranscript = "";

let interimTranscript = "";

let displayedTranscript = "";

let recordingTimer = null;

let restartTimer = null;

let isSending = false;


// ⭐⭐⭐ 확인 대기 토큰

let pendingToken = null;


// ============================================================================
// ⭐ 4. DOM
// ============================================================================

const startButton =
  document.getElementById(
    "startButton"
  );

const finishButton =
  document.getElementById(
    "finishButton"
  );

const result =
  document.getElementById(
    "result"
  );

const timer =
  document.getElementById(
    "timer"
  );


// ============================================================================
// 🧹 5. 텍스트 정리
// ============================================================================

function cleanText(text) {

  return String(text || "")
    .replace(/\s+/g, " ")
    .trim();

}


// ============================================================================
// 🧹 6. 중복 문장 방지
// ============================================================================

function appendWithoutDuplicate(
  current,
  addition
) {

  addition =
    cleanText(addition);

  if (!addition) {
    return current;
  }

  if (!current) {
    return addition;
  }

  // 완전히 같은 경우
  if (
    current === addition
  ) {

    return current;

  }

  // 현재 문장이 이미 추가 문장을 포함하는 경우
  if (
    current.includes(addition)
  ) {

    return current;

  }

  // 추가 문장이 현재 문장을 포함하는 경우
  if (
    addition.includes(current)
  ) {

    return addition;

  }

  return (
    current +
    " " +
    addition
  );

}


// ============================================================================
// 👀 7. 현재 음성 화면 표시
// ============================================================================

function showCurrentText() {

  const finalText =
    cleanText(
      finalTranscript
    );

  const interimText =
    cleanText(
      interimTranscript
    );

  displayedTranscript =
    cleanText(
      finalText +
      (
        interimText
          ? " " + interimText
          : ""
      )
    );

  result.innerHTML =
    '<div class="listening">' +
    '🎙️ 듣고 있어요...<br><br>' +
    '</div>' +
    (
      displayedTranscript ||
      "말씀해주세요."
    );

}


// ============================================================================
// 🎙️ 8. 음성인식 시작
// ============================================================================

function startRecognition() {

  if (!SpeechRecognition) {
    return;
  }

  try {

    if (recognitionRunning) {
      return;
    }

    recognition.start();

  } catch (error) {

    console.log(
      "recognition.start 오류:",
      error
    );

  }

}


// ============================================================================
// 🟢 9. 말하기 시작
// ============================================================================

startButton.addEventListener(
  "click",
  function() {

    if (isSending) {
      return;
    }

    // 이전 확인 결과 제거
    pendingToken = null;

    finalTranscript = "";

    interimTranscript = "";

    displayedTranscript = "";

    finishRequested = false;

    isRecording = true;

    startButton.disabled = true;

    finishButton.disabled = false;

    timer.textContent =
      "⏱️ 최대 30초";

    result.innerHTML =
      '<div class="listening">' +
      '🎙️ 듣고 있어요...<br><br>' +
      '말씀해주세요.' +
      '</div>';


    // ------------------------------------------------------------------------
    // 음성인식 객체 생성
    // ------------------------------------------------------------------------

    recognition =
      new SpeechRecognition();

    recognition.lang =
      "ko-KR";

    recognition.continuous =
      true;

    recognition.interimResults =
      true;

    recognition.maxAlternatives =
      1;


    // ------------------------------------------------------------------------
    // 음성 결과
    // ------------------------------------------------------------------------

    recognition.onresult =
      function(event) {

        let newFinal = "";

        let newInterim = "";

        for (
          let i = event.resultIndex;
          i < event.results.length;
          i++
        ) {

          const transcript =
            cleanText(
              event.results[i][0].transcript
            );

          if (
            event.results[i].isFinal
          ) {

            newFinal =
              appendWithoutDuplicate(
                newFinal,
                transcript
              );

          } else {

            newInterim =
              appendWithoutDuplicate(
                newInterim,
                transcript
              );

          }

        }


        if (newFinal) {

          finalTranscript =
            appendWithoutDuplicate(
              finalTranscript,
              newFinal
            );

        }

        interimTranscript =
          newInterim;

        showCurrentText();

      };


    // ------------------------------------------------------------------------
    // 음성인식 종료
    // ------------------------------------------------------------------------

    recognition.onend =
      function() {

        recognitionRunning =
          false;

        if (
          isRecording &&
          !finishRequested
        ) {

          clearTimeout(
            restartTimer
          );

          restartTimer =
            setTimeout(
              function() {

                if (
                  isRecording &&
                  !finishRequested
                ) {

                  startRecognition();

                }

              },
              300
            );

        }

      };


    // ------------------------------------------------------------------------
    // 음성인식 오류
    // ------------------------------------------------------------------------

    recognition.onerror =
      function(event) {

        console.log(
          "음성인식 오류:",
          event.error
        );

        recognitionRunning =
          false;

        if (
          event.error ===
          "not-allowed"
        ) {

          result.innerHTML =
            '<div class="error">' +
            '❌ 마이크 권한이 필요합니다.<br><br>' +
            '브라우저에서 마이크 권한을 허용해주세요.' +
            '</div>';

          isRecording = false;

          startButton.disabled =
            false;

          finishButton.disabled =
            true;

        }

      };


    recognition.onstart =
      function() {

        recognitionRunning =
          true;

      };


    startRecognition();


    // ------------------------------------------------------------------------
    // 최대 30초
    // ------------------------------------------------------------------------

    clearTimeout(
      recordingTimer
    );

    recordingTimer =
      setTimeout(
        function() {

          if (isRecording) {

            finishRecording();

          }

        },
        30000
      );

  }
);


// ============================================================================
// 🛑 10. 말하기 완료
// ============================================================================

finishButton.addEventListener(
  "click",
  function() {

    finishRecording();

  }
);


// ============================================================================
// 🛑 11. 녹음 종료
// ============================================================================

function finishRecording() {

  if (!isRecording) {
    return;
  }

  isRecording =
    false;

  finishRequested =
    true;

  clearTimeout(
    recordingTimer
  );

  clearTimeout(
    restartTimer
  );

  if (recognition) {

    try {

      recognition.stop();

    } catch (error) {

      console.log(
        "recognition.stop 오류:",
        error
      );

    }

  }

  startButton.disabled =
    false;

  finishButton.disabled =
    true;

  timer.textContent = "";

  // --------------------------------------------------------------------------
  // 최종 문장
  // --------------------------------------------------------------------------

  const text =
    cleanText(
      finalTranscript ||
      displayedTranscript
    );

  if (!text) {

    result.innerHTML =
      '<div class="error">' +
      '❌ 음성 내용을 듣지 못했어요.<br><br>' +
      '다시 말해주세요.' +
      '</div>';

    return;

  }

  finalizeAndSend(
    text
  );

}


// ============================================================================
// 📡 12. 분석 요청
// ============================================================================
//
// ⭐⭐⭐ 여기서는 Notion 등록을 하지 않습니다.
//
// action = analyze
//
// GAS는:
// 음성 → 분석 → Sheet 저장 → 미리보기
//
//까지만 합니다.
// ============================================================================

function finalizeAndSend(
  text
) {

  if (isSending) {
    return;
  }

  isSending = true;

  result.innerHTML =
    '<div class="listening">' +
    '🔎 음성을 분석하고 있어요...<br><br>' +
    '잠시만 기다려주세요.' +
    '</div>';

  sendAnalyzeToGAS(
    text
  );

}


// ============================================================================
// 📡 13. GAS 분석 요청
// ============================================================================

async function sendAnalyzeToGAS(
  text
) {

  try {

    const response =
      await fetch(
        GAS_URL,
        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify({

              action:
                "analyze",

              text:
                text

            })

        }
      );


    const raw =
      await response.text();

    console.log(
      "GAS 분석 응답:",
      raw
    );


    let data;

    try {

      data =
        JSON.parse(
          raw
        );

    } catch (jsonError) {

      throw new Error(
        "GAS 응답을 읽지 못했습니다.\n\n" +
        raw
      );

    }


    // ------------------------------------------------------------------------
    // ❌ 분석 실패
    // ------------------------------------------------------------------------

    if (
      data.status !==
      "preview"
    ) {

      throw new Error(
        data.message ||
        "음성 분석에 실패했습니다."
      );

    }


    // ------------------------------------------------------------------------
    // ⭐ 확인 토큰 저장
    // ------------------------------------------------------------------------

    pendingToken =
      data.token;


    // ------------------------------------------------------------------------
    // ⭐⭐⭐ 미리보기 화면
    // ------------------------------------------------------------------------

    showPreview(
      data
    );


  } catch (error) {

    console.error(
      error
    );

    result.innerHTML =
      '<div class="error">' +
      '❌ 분석하지 못했어요.<br><br>' +
      escapeHtml(
        error.message ||
        String(error)
      ) +
      '</div>' +

      '<div class="button-group">' +

      '<button ' +
      'id="retryButton" ' +
      'style="background:#666;color:white;"' +
      '>' +
      '❌ 다시 말하기' +
      '</button>' +

      '</div>';


    const retryButton =
      document.getElementById(
        "retryButton"
      );

    retryButton.addEventListener(
      "click",
      function() {

        resetForNewRecording();

      }
    );

  } finally {

    isSending = false;

  }

}


// ============================================================================
// 👀 14. 미리보기 화면
// ============================================================================

function showPreview(
  data
) {

  const html =

    '<div class="preview-title">' +
    '🔎 아래 내용이 맞나요?' +
    '</div>' +


    '<div class="preview-row">' +

    '<div class="preview-label">' +
    '🏢 거래처' +
    '</div>' +

    '<div class="preview-value">' +
    escapeHtml(
      data.clientName
    ) +
    '</div>' +

    '</div>' +


    '<div class="preview-row">' +

    '<div class="preview-label">' +
    '🏭 제품' +
    '</div>' +

    '<div class="preview-value">' +
    escapeHtml(
      data.productName
    ) +
    '</div>' +

    '</div>' +


    '<div class="preview-row">' +

    '<div class="preview-label">' +
    '📏 규격' +
    '</div>' +

    '<div class="preview-value">' +
    escapeHtml(
      data.size
    ) +
    '</div>' +

    '</div>' +


    '<div class="preview-row">' +

    '<div class="preview-label">' +
    '📦 수량' +
    '</div>' +

    '<div class="preview-value">' +
    escapeHtml(
      String(data.quantity) +
      "박스"
    ) +
    '</div>' +

    '</div>' +


    '<div class="preview-row">' +

    '<div class="preview-label">' +
    '📤 구분' +
    '</div>' +

    '<div class="preview-value">' +
    escapeHtml(
      data.mode
    ) +
    '</div>' +

    '</div>' +


    '<div class="preview-row">' +

    '<div class="preview-label">' +
    '📅 납품요청일' +
    '</div>' +

    '<div class="preview-value">' +
    escapeHtml(
      data.deliveryDate
    ) +
    '</div>' +

    '</div>' +


    '<div class="original-text">' +

    '<strong>🗣 내가 말한 원문</strong><br><br>' +

    escapeHtml(
      data.text
    ) +

    '</div>' +


    '<div class="button-group">' +

    '<button ' +
    'id="confirmButton"' +
    '>' +
    '✅ 맞아요. 노션에 등록' +
    '</button>' +

    '<button ' +
    'id="retryButton"' +
    'style="background:#666;color:white;"' +
    '>' +
    '❌ 다시 말하기' +
    '</button>' +

    '</div>';


  result.innerHTML =
    html;


  // --------------------------------------------------------------------------
  // 확인 버튼
  // --------------------------------------------------------------------------

  document
    .getElementById(
      "confirmButton"
    )
    .addEventListener(
      "click",
      function() {

        confirmNotionRegistration();

      }
    );


  // --------------------------------------------------------------------------
  // 다시 말하기 버튼
  // --------------------------------------------------------------------------

  document
    .getElementById(
      "retryButton"
    )
    .addEventListener(
      "click",
      function() {

        resetForNewRecording();

      }
    );

}


// ============================================================================
// 🔐 15. 사용자가 확인 → Notion 등록
// ============================================================================

async function confirmNotionRegistration() {

  if (
    !pendingToken
  ) {

    result.innerHTML =
      '<div class="error">' +
      '❌ 확인 시간이 만료되었어요.<br><br>' +
      '다시 말씀해주세요.' +
      '</div>';

    return;

  }


  if (isSending) {
    return;
  }

  isSending =
    true;


  const confirmButton =
    document.getElementById(
      "confirmButton"
    );

  const retryButton =
    document.getElementById(
      "retryButton"
    );


  if (confirmButton) {

    confirmButton.disabled =
      true;

    confirmButton.textContent =
      "⏳ 노션에 등록 중...";

  }

  if (retryButton) {

    retryButton.disabled =
      true;

  }


  result.innerHTML =
    '<div class="listening">' +
    '📝 노션에 등록하고 있어요...<br><br>' +
    '잠시만 기다려주세요.' +
    '</div>';


  try {

    const response =
      await fetch(
        GAS_URL,
        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify({

              action:
                "confirm",

              token:
                pendingToken

            })

        }
      );


    const raw =
      await response.text();


    console.log(
      "GAS 등록 응답:",
      raw
    );


    let data;

    try {

      data =
        JSON.parse(
          raw
        );

    } catch (jsonError) {

      throw new Error(
        "GAS 등록 응답을 읽지 못했습니다.\n\n" +
        raw
      );

    }


    // ------------------------------------------------------------------------
    // ❌ 등록 실패
    // ------------------------------------------------------------------------

    if (
      data.status !==
      "success"
    ) {

      throw new Error(
        data.message ||
        "Notion 등록에 실패했습니다."
      );

    }


    // ------------------------------------------------------------------------
    // 🎉 등록 성공
    // ------------------------------------------------------------------------

    pendingToken =
      null;


    result.innerHTML =

      '<div class="success">' +

      '🎉 노션 등록 완료!' +

      '</div>' +

      '<br>' +

      '<strong>' +
      escapeHtml(
        data.clientName
      ) +
      '</strong>' +

      ' / ' +

      escapeHtml(
        data.productName
      ) +

      ' / ' +

      escapeHtml(
        String(data.quantity) +
        "박스"
      ) +

      ' / ' +

      escapeHtml(
        data.mode
      ) +

      '<br><br>' +

      '📅 납품요청일: ' +

      escapeHtml(
        data.deliveryDate
      );


    // ------------------------------------------------------------------------
    // Notion 페이지 링크가 있으면 표시
    // ------------------------------------------------------------------------

    if (
      data.notionUrl
    ) {

      result.innerHTML +=

        '<br><br>' +

        '<a ' +
        'href="' +
        escapeAttribute(
          data.notionUrl
        ) +
        '" ' +
        'target="_blank" ' +
        'style="font-size:16px;"' +
        '>' +

        '🔗 노션 페이지 열기' +

        '</a>';

    }


    result.innerHTML +=

      '<div class="button-group">' +

      '<button ' +
      'id="newRecordButton"' +
      'style="background:#222;color:white;"' +
      '>' +

      '🎙️ 새 입출고 말하기' +

      '</button>' +

      '</div>';


    document
      .getElementById(
        "newRecordButton"
      )
      .addEventListener(
        "click",
        function() {

          resetForNewRecording();

        }
      );


  } catch (error) {

    console.error(
      error
    );

    result.innerHTML =

      '<div class="error">' +

      '❌ 노션 등록에 실패했어요.' +

      '<br><br>' +

      escapeHtml(
        error.message ||
        String(error)
      ) +

      '</div>' +

      '<div class="button-group">' +

      '<button ' +
      'id="retryButton"' +
      'style="background:#666;color:white;"' +
      '>' +

      '🔄 다시 말하기' +

      '</button>' +

      '</div>';


    document
      .getElementById(
        "retryButton"
      )
      .addEventListener(
        "click",
        function() {

          resetForNewRecording();

        }
      );

  } finally {

    isSending =
      false;

  }

}


// ============================================================================
// 🔄 16. 새 음성 입력 준비
// ============================================================================

function resetForNewRecording() {

  clearTimeout(
    recordingTimer
  );

  clearTimeout(
    restartTimer
  );


  if (
    recognition
  ) {

    try {

      recognition.stop();

    } catch (error) {

      console.log(
        error
      );

    }

  }


  isRecording =
    false;

  finishRequested =
    true;

  recognitionRunning =
    false;

  finalTranscript =
    "";

  interimTranscript =
    "";

  displayedTranscript =
    "";

  pendingToken =
    null;

  isSending =
    false;


  startButton.disabled =
    false;

  finishButton.disabled =
    true;

  timer.textContent =
    "";


  result.innerHTML =
    "버튼을 누르고 말씀해주세요.";

}


// ============================================================================
// 🛡️ 17. HTML 안전 처리
// ============================================================================

function escapeHtml(
  value
) {

  return String(
    value == null
      ? ""
      : value
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeAttribute(
  value
) {

  return escapeHtml(
    value
  );

}
