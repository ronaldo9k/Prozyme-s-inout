```html
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="theme-color" content="#05070b">

  <title>푸로찜 에스 음성 입출고 시스템</title>


  <style>

    /* ========================================================================
       ⭐ 기본
       ======================================================================== */

    * {
      box-sizing: border-box;
    }


    :root {

      --bg: #05070b;

      --card: rgba(255,255,255,.96);

      --text: #111827;

      --muted: #6b7280;

      --line: #e5e7eb;

      --green: #15803d;

      --red: #dc2626;

      --dark: #111827;

      --gold: #c9a227;

    }


    /* ========================================================================
       ⭐ 전체 배경
       ======================================================================== */

    body {

      margin: 0;

      padding: 0 14px 30px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: var(--text);

      min-height: 100vh;

      position: relative;

      overflow-x: hidden;

      background:
        #05070b
        url("ronaldo-fenomeno.png")
        center top /
        cover
        fixed
        no-repeat;

    }


    /* ========================================================================
       ⭐ 전체 배경 어둡게 처리
       ======================================================================== */

    body::before {

      content: "";

      position: fixed;

      inset: 0;

      z-index: -1;

      pointer-events: none;

      background:

        linear-gradient(
          180deg,
          rgba(0,0,0,.38) 0%,
          rgba(0,0,0,.55) 38%,
          rgba(0,0,0,.78) 100%
        );

    }


    /* ========================================================================
       ⭐ 황금빛 분위기
       ======================================================================== */

    body::after {

      content: "";

      position: fixed;

      inset: 0;

      z-index: -1;

      pointer-events: none;

      background:

        radial-gradient(
          circle at 50% 8%,
          rgba(201,162,39,.20),
          transparent 30%
        ),

        radial-gradient(
          circle at 50% 45%,
          rgba(0,0,0,0),
          rgba(0,0,0,.35) 75%
        );

    }


    .container {

      max-width: 560px;

      margin: 0 auto;

      position: relative;

      z-index: 1;

    }


    /* ========================================================================
       ⭐ 화면 단계
       ======================================================================== */

    .screen {

      width: 100%;

    }


    #inputScreen {

      display: block;

    }


    #resultCard {

      display: block;

    }


    .step-hidden {

      display: none !important;

    }


    .step-indicator {

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 8px;

      margin: 4px 0 15px;

      font-size: 12px;

      font-weight: 800;

      color: #d1d5db;

      text-shadow:
        0 2px 5px rgba(0,0,0,.7);

    }


    .step-dot {

      width: 26px;

      height: 26px;

      border-radius: 50%;

      display: flex;

      align-items: center;

      justify-content: center;

      background: rgba(255,255,255,.22);

      color: #e5e7eb;

      font-size: 12px;

      font-weight: 900;

      border: 1px solid rgba(255,255,255,.18);

      backdrop-filter: blur(5px);

    }


    .step-dot.active {

      background: #c9a227;

      color: #111827;

      border-color: #e5c45b;

      box-shadow:
        0 0 14px rgba(201,162,39,.55);

    }


    .step-line {

      width: 35px;

      height: 2px;

      background: rgba(255,255,255,.25);

    }


    /* ========================================================================
       ⭐ HERO
       ======================================================================== */

    .hero {

      position: relative;

      margin: 0 -14px 18px;

      height: 285px;

      overflow: hidden;

      border-radius: 0 0 30px 30px;

      background:
        #05070b
        url("ronaldo-fenomeno.png")
        center 22% /
        cover
        no-repeat;

      box-shadow:
        0 14px 35px rgba(0,0,0,.45);

    }


    .hero-image {

      display: none;

    }


    .hero-overlay {

      position: absolute;

      inset: 0;

      background:

        linear-gradient(
          180deg,
          rgba(0,0,0,.05) 0%,
          rgba(0,0,0,.22) 30%,
          rgba(0,0,0,.88) 100%
        );

    }


    .hero-content {

      position: absolute;

      left: 22px;

      right: 22px;

      bottom: 18px;

      color: white;

      text-align: center;

      text-shadow:
        0 2px 8px rgba(0,0,0,.85),
        0 4px 18px rgba(0,0,0,.72);

    }


    .hero-kicker {

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      gap: 1px;

      font-size: 1px;

      line-height: 1;

      margin-bottom: 7px;

      color: #fff;

      text-align: center;

      transform: none;

      text-shadow: 0 4px 12px rgba(0,0,0,.95);

    }


    .kicker-name {

      font-family: Georgia, "Times New Roman", serif;

      font-size: 12px;

      font-weight: 700;

      font-style: normal;

      letter-spacing: 4.5px;

      color: #f4e5ae;

      text-shadow:
        0 1px 0 rgba(255,255,255,.55),
        0 3px 8px rgba(0,0,0,.9);

    }


    .kicker-crown {

      display: block;

      margin: -1px 0 -1px;

      font-family: Georgia, "Times New Roman", serif;

      font-size: 17px;

      line-height: .9;

      color: #f1c84b;

      text-shadow:
        0 1px 0 #fff0a0,
        0 2px 5px rgba(0,0,0,.95),
        0 0 12px rgba(239,192,47,.5);

    }


    .kicker-fenomeno {

      display: block;

      font-family: "Brush Script MT", "Segoe Print", "Bradley Hand", cursive;

      font-size: 29px;

      line-height: .9;

      font-weight: 900;

      font-style: italic;

      letter-spacing: 1px;

      color: #f3ca55;

      transform: skewX(-7deg) rotate(-1deg);

      text-shadow:
        1px 1px 0 #fff0a5,
        2px 3px 0 #a9750c,
        3px 5px 0 #684500,
        0 8px 15px rgba(0,0,0,.95),
        0 0 18px rgba(244,190,40,.42);

      -webkit-text-stroke: .45px rgba(255,232,142,.68);

    }


    .hero-title {

      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;

      font-size: 32px;

      line-height: 1.04;

      font-weight: 900;

      margin: 0;

      letter-spacing: 1.8px;

      color: #ffffff;

      text-shadow:
        0 2px 0 rgba(0,0,0,.85),
        0 4px 10px rgba(0,0,0,.92),
        0 0 20px rgba(255,255,255,.12);

    }


    .hero-sub {

      margin-top: 9px;

      font-size: 13px;

      line-height: 1.35;

      font-weight: 800;

      letter-spacing: 1.8px;

      color: #fff;

      opacity: 1;

      text-shadow:
        0 1px 0 rgba(255,255,255,.3),
        0 3px 10px rgba(0,0,0,.95);

    }


    /* ========================================================================
       ⭐ CARD
       ======================================================================== */

    .card {

      background:
        rgba(255,255,255,.95);

      border-radius: 22px;

      padding: 19px;

      margin-bottom: 16px;

      box-shadow:
        0 10px 32px rgba(0,0,0,.30);

      backdrop-filter: blur(10px);

      -webkit-backdrop-filter: blur(10px);

    }


    /* ========================================================================
       ⭐ 버튼 기본
       ======================================================================== */

    button {

      width: 100%;

      border: 1.5px solid rgba(232,194,70,.95);

      border-radius: 19px;

      padding: 15px 18px;

      font-size: 18px;

      font-weight: 900;

      letter-spacing: .2px;

      cursor: pointer;

      margin-top: 9px;

      transition:
        transform .12s ease,
        opacity .12s ease,
        box-shadow .12s ease;

      position: relative;

      overflow: hidden;

      text-shadow: 0 2px 5px rgba(0,0,0,.75);

      box-shadow:
        0 5px 16px rgba(0,0,0,.45),
        0 0 13px rgba(226,185,52,.18),
        inset 0 1px 0 rgba(255,245,190,.2);

      backdrop-filter: blur(8px);

      -webkit-backdrop-filter: blur(8px);

    }


    /* ========================================================================
       ⭐ 첫 화면 3개 메인 버튼 영역
       ======================================================================== */

    #inputScreen > .card:first-of-type {

      background: transparent;

      box-shadow: none;

      backdrop-filter: none;

      -webkit-backdrop-filter: none;

      padding: 0 8px 2px;

    }


    /* ========================================================================
       ⭐⭐⭐ 메인 버튼
       ⭐ 폭만 약 3/4로 축소
       ⭐ 세로 중앙 정렬을 명시적으로 고정
       ======================================================================== */

    #inputScreen > .card:first-of-type button {

      /* 기존 190px → 약 3/4인 145px */
      width: 145px;

      height: 56px;

      min-height: 56px;

      margin: 9px auto 0;

      padding: 7px 10px 7px 8px;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 6px;

      border-radius: 30px;

      border: 1.5px solid #e5b83c;

      background:

        linear-gradient(
          135deg,
          rgba(5,7,8,.98) 0%,
          rgba(28,23,12,.97) 50%,
          rgba(6,7,8,.99) 100%
        );

      color: #fff;

      font-size: 16px;

      font-weight: 900;

      letter-spacing: -.2px;

      /* ⭐ 버튼 글자의 위/아래 정확한 중앙 */
      line-height: 1;

      text-align: center;

      text-shadow:
        0 2px 5px rgba(0,0,0,.95);

      box-shadow:

        0 5px 13px rgba(0,0,0,.58),

        0 0 9px rgba(226,181,48,.27),

        inset 0 1px 0 rgba(255,245,190,.18),

        inset 0 -1px 0 rgba(0,0,0,.85);

      backdrop-filter: blur(8px);

      -webkit-backdrop-filter: blur(8px);

    }


    /* ========================================================================
       ⭐ 금색 원형 아이콘
       ======================================================================== */

    .main-button-icon {

      flex: 0 0 40px;

      width: 40px;

      height: 40px;

      border-radius: 50%;

      display: flex;

      align-items: center;

      justify-content: center;

      border: 1.5px solid #dcae31;

      background:

        radial-gradient(
          circle,
          rgba(45,36,14,.98) 0%,
          rgba(18,16,10,.98) 68%,
          rgba(7,8,8,1) 100%
        );

      box-shadow:

        0 0 7px rgba(226,181,47,.28),

        inset 0 1px 2px rgba(255,240,160,.18);

      color: #efbd3d;

      text-shadow:
        0 0 7px rgba(240,194,65,.75);

    }


    /* ========================================================================
       ⭐ SVG 아이콘
       ======================================================================== */

    .main-button-icon svg {

      width: 21px;

      height: 21px;

      display: block;

      fill: none;

      stroke: currentColor;

      stroke-width: 2.2;

      stroke-linecap: round;

      stroke-linejoin: round;

      filter:
        drop-shadow(
          0 0 4px rgba(239,190,58,.35)
        );

    }


    /* ========================================================================
       ⭐ 정지 아이콘은 이미지처럼 꽉 찬 금색 사각형
       ======================================================================== */

    #finishButton .main-button-icon svg {

      width: 17px;

      height: 17px;

      fill: currentColor;

      stroke: none;

      filter:
        drop-shadow(
          0 0 4px rgba(239,190,58,.4)
        );

    }


    /* ========================================================================
       ⭐ 버튼 글자
       ⭐ 위/아래 기준 정중앙
       ======================================================================== */

    .main-button-label {

      flex: 0 0 auto;

      min-width: 0;

      text-align: center;

      white-space: nowrap;

      color: #ffffff;

      font-size: 16px;

      font-weight: 900;

      letter-spacing: -.3px;

      /* ⭐ 글자 자체의 세로 중심 고정 */
      line-height: 1;

      display: block;

    }


    /* ========================================================================
       ⭐ 오른쪽 금색 화살표
       ======================================================================== */

    #inputScreen > .card:first-of-type button::after {

      content: "›";

      position: absolute;

      right: 8px;

      top: 50%;

      transform: translateY(-54%);

      color: #e9bb3e;

      font-size: 30px;

      line-height: 1;

      font-weight: 300;

      text-shadow:

        0 0 8px rgba(239,193,60,.65),

        0 2px 4px rgba(0,0,0,.95);

    }


    /* ========================================================================
       ⭐ 버튼 위 금색 하이라이트
       ======================================================================== */

    #inputScreen > .card:first-of-type button::before {

      content: "";

      position: absolute;

      left: 20px;

      right: 20px;

      top: 0;

      height: 1px;

      background:

        linear-gradient(
          90deg,
          transparent,
          rgba(255,239,160,.78),
          transparent
        );

      pointer-events: none;

    }


    /* ========================================================================
       ⭐ 버튼 눌림
       ======================================================================== */

    #inputScreen > .card:first-of-type button:active {

      transform:
        translateY(1px)
        scale(.985);

      box-shadow:

        0 2px 8px rgba(0,0,0,.65),

        0 0 19px rgba(226,185,52,.42),

        inset 0 2px 4px rgba(0,0,0,.48),

        inset 0 1px 0 rgba(255,245,190,.24);

    }


    /* ========================================================================
       ⭐ 버튼별 미세한 색감
       ======================================================================== */

    #startButton {

      background:

        linear-gradient(
          135deg,
          rgba(5,7,8,.98),
          rgba(43,34,14,.95),
          rgba(7,8,8,.99)
        );

    }


    #finishButton {

      background:

        linear-gradient(
          135deg,
          rgba(7,7,8,.98),
          rgba(42,27,16,.95),
          rgba(7,8,8,.99)
        );

    }


    #directButton {

      background:

        linear-gradient(
          135deg,
          rgba(5,7,8,.98),
          rgba(43,35,15,.95),
          rgba(7,8,8,.99)
        );

    }


    /* ========================================================================
       ⭐ 비활성 버튼
       ⭐ 처음에는 말하기 완료가 확실히 흐리게 보임
       ⭐ 말하기 시작 후 disabled=false가 되면 자동으로 원래 밝기
       ======================================================================== */

    #inputScreen > .card:first-of-type button:disabled {

      opacity: .38;

      cursor: not-allowed;

      filter: saturate(.55) brightness(.78);

      box-shadow:

        0 3px 8px rgba(0,0,0,.48),

        0 0 4px rgba(226,181,48,.08),

        inset 0 1px 0 rgba(255,245,190,.08),

        inset 0 -1px 0 rgba(0,0,0,.90);

    }


    /* ========================================================================
       ⭐⭐⭐ statusCard
       ⭐ 버튼 바로 아래에 존재
       ⭐ 스크롤하면 화면 상단에 붙어서 계속 보임
       ⭐ 음성 인식 중인 내용이 계속 보이도록 유지
       ======================================================================== */

    #statusCard {

      position: sticky;

      top: 8px;

      z-index: 100;

      width: 100%;

      margin-top: 8px;

      /* ⭐ 상단 고정 시 배경이 확실히 보이도록 */
      background:
        rgba(255,255,255,.97);

      box-shadow:
        0 10px 30px rgba(0,0,0,.38);

    }


    button:disabled {

      cursor: not-allowed;

    }


    /* ========================================================================
       ⭐ 확인 화면 버튼
       ======================================================================== */

    #confirmButton {

      background: var(--green);

      color: white;

    }


    #retryButton {

      background: #64748b;

      color: white;

    }


    #result {

      line-height: 1.7;

      font-size: 17px;

    }


    .listening {

      color: var(--red);

      font-weight: 800;

    }


    .success {

      color: var(--green);

      font-weight: 900;

      font-size: 19px;

    }


    .error {

      color: var(--red);

      font-weight: 800;

    }


    /* ========================================================================
       ⭐ 상태
       ======================================================================== */

    .timer {

      text-align: center;

      font-size: 14px;

      color: #6b7280;

      margin-top: 9px;

    }


    .loading {

      text-align: center;

      padding: 10px 0;

      color: #555;

      font-weight: 700;

    }


    /* ========================================================================
       ⭐ 확인 화면
       ======================================================================== */

    .preview-top {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

      margin-bottom: 12px;

    }


    .preview-back {

      width: auto;

      margin: 0;

      padding: 8px 12px;

      border-radius: 10px;

      background: #f1f5f9;

      color: #475569;

      font-size: 13px;

      font-weight: 800;

    }


    .preview-step {

      font-size: 12px;

      font-weight: 900;

      color: #64748b;

    }


    .preview-title {

      font-size: 22px;

      font-weight: 900;

      margin-bottom: 8px;

    }


    .preview-badge {

      display: inline-block;

      padding: 5px 9px;

      border-radius: 999px;

      background: #f3f4f6;

      color: #4b5563;

      font-size: 12px;

      font-weight: 800;

      margin-bottom: 18px;

    }


    .edit-row {

      margin-bottom: 16px;

    }


    .edit-label {

      display: block;

      color: #4b5563;

      font-size: 14px;

      font-weight: 800;

      margin-bottom: 7px;

    }


    .edit-input,
    .edit-select {

      width: 100%;

      padding: 14px;

      border: 1px solid #d7dbe1;

      border-radius: 12px;

      background: white;

      font-size: 17px;

      outline: none;

    }


    .edit-input:focus,
    .edit-select:focus {

      border-color: var(--green);

      box-shadow:
        0 0 0 3px rgba(21,128,61,.10);

    }


    .size-display {

      background: #f3f4f6;

      color: #555;

      cursor: not-allowed;

    }


    .help-text {

      margin-top: 5px;

      font-size: 12px;

      color: #777;

    }


    .original-text {

      background: #f3f4f6;

      padding: 14px;

      border-radius: 12px;

      margin-top: 18px;

      font-size: 15px;

      line-height: 1.6;

    }


    .button-group {

      margin-top: 19px;

    }


    /* ========================================================================
       ⭐ 거래처 검색 + 오른쪽 ▼ 선택
       ======================================================================== */

    .client-choice-row {

      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        150px;

      gap: 8px;

      align-items: stretch;

    }


    .client-search-wrap {

      position: relative;

      min-width: 0;

    }


    .client-search-input {

      padding-left: 43px;

    }


    .search-icon {

      position: absolute;

      left: 14px;

      top: 13px;

      font-size: 20px;

      z-index: 2;

      pointer-events: none;

    }


    #clientSelect {

      display: block;

      min-width: 0;

      cursor: pointer;

      padding-right: 10px;

    }


    .client-candidates {

      margin-top: 7px;

      border: 1px solid #e1e5ea;

      border-radius: 12px;

      overflow: hidden;

      background: white;

      max-height: 220px;

      overflow-y: auto;

    }


    .candidate-empty {

      padding: 13px;

      color: #777;

      font-size: 14px;

    }


    .candidate-item {

      width: 100%;

      text-align: left;

      border: 0;

      border-bottom: 1px solid #edf0f3;

      border-radius: 0;

      margin: 0;

      padding: 13px 14px;

      background: white;

      color: #111827;

      font-size: 16px;

      font-weight: 700;

    }


    .candidate-item:last-child {

      border-bottom: 0;

    }


    .candidate-item:hover {

      background: #f5f7fa;

    }


    .selected-client {

      margin-top: 8px;

      padding: 10px 12px;

      border-radius: 10px;

      background: #ecfdf3;

      color: #166534;

      font-size: 14px;

      font-weight: 800;

    }


    /* ========================================================================
       ⭐ 기타
       ======================================================================== */

    .mode-hint {

      display: flex;

      gap: 7px;

      flex-wrap: wrap;

      margin: -4px 0 16px;

    }


    .hint-chip {

      background: #f8fafc;

      border: 1px solid #e5e7eb;

      border-radius: 999px;

      padding: 5px 9px;

      font-size: 12px;

      color: #64748b;

      font-weight: 700;

    }


    /* ========================================================================
       ⭐ 모바일
       ======================================================================== */

    @media (max-width: 500px) {

      body {

        background-position:
          center top;

        background-size:
          auto 100vh;

        background-attachment:
          fixed;

      }


      .client-choice-row {

        grid-template-columns:
          minmax(0, 1fr)
          125px;

      }


      .hero {

        height: 285px;

        background-position:
          center 22%;

      }


      /* ⭐ 요청사항: 메인 버튼 폭 약 3/4 */

      #inputScreen > .card:first-of-type button {

        width: 145px;

        height: 56px;

        min-height: 56px;

      }

    }


    @media (max-width: 420px) {

      .hero {

        height: 285px;

      }


      .hero-title {

        font-size: 30px;

      }


      .kicker-name {

        font-size: 10px;

        letter-spacing: 3.4px;

      }


      .kicker-crown {

        font-size: 15px;

      }


      .kicker-fenomeno {

        font-size: 27px;

      }


      .hero-sub {

        font-size: 12px;

      }


      .card {

        padding: 16px;

      }


      .client-choice-row {

        grid-template-columns:
          minmax(0, 1fr)
          115px;

      }


      .edit-select {

        font-size: 15px;

      }


      /* ⭐ 요청사항: 메인 버튼 폭 약 3/4 */

      #inputScreen > .card:first-of-type button {

</head>


<body>

<script>


// ============================================================================
// ⭐ 1. GAS 주소
// ============================================================================

const GAS_URL =
  "https://script.google.com/macros/s/AKfycbwAzVaYx0UJGE84-U4AffY01B8gxJQZpWtihyx2M8lW3eDr9dXy6IbFv7BwxLYlmO1h/exec";


// ============================================================================
// ⭐ 2. 음성인식
// ============================================================================

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (!SpeechRecognition) {

  document.getElementById("result").innerHTML =
    '<div class="error">' +
    '❌ 이 브라우저에서는 음성인식을 지원하지 않습니다.<br><br>' +
    '삼성 인터넷 또는 Chrome을 사용해주세요.' +
    '</div>';

}


// ============================================================================
// ⭐ 3. 상태 변수
// ============================================================================

let recognition = null;

let isRecording = false;

let finishRequested = false;

let recognitionRunning = false;

let finalTranscript = "";

let interimTranscript = "";

let displayedTranscript = "";

let recordingTimer = null;

let isSending = false;

let pendingToken = null;

let clientList = [];

let productList = [];

let deliveryTypeList = [];

let secondDeliveryLocationList = [];

let currentInputMode = "voice";


// ============================================================================
// ⭐ 4. DOM
// ============================================================================

const inputScreen =
  document.getElementById("inputScreen");


const resultCard =
  document.getElementById("resultCard");


const statusCard =
  document.getElementById("statusCard");


const startButton =
  document.getElementById("startButton");


const finishButton =
  document.getElementById("finishButton");


const directButton =
  document.getElementById("directButton");


const timer =
  document.getElementById("timer");


// ============================================================================
// ⭐ 버튼 표시 글자 변경
// ============================================================================

function setStartButtonLabel(
  label
) {

  const labelElement =
    startButton.querySelector(
      ".main-button-label"
    );


  if (labelElement) {

    labelElement.textContent =
      label;

  }

}


// ============================================================================
// ⭐ 화면 전환
// ============================================================================

function showInputScreen() {

  inputScreen.classList.remove("step-hidden");

  resultCard.classList.add("step-hidden");

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


function showResultScreen() {

  inputScreen.classList.add("step-hidden");

  resultCard.classList.remove("step-hidden");

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


// ============================================================================
// ⭐ 화면 내부 결과 출력
// ============================================================================

const inputResult =
  document.querySelector("#statusCard #result");


const previewResult =
  document.querySelector("#resultCard #result");


// ============================================================================
// 🧹 5. 텍스트 정리
// ============================================================================

function cleanText(text) {

  return String(text || "")
    .replace(/\s+/g, " ")
    .trim();

}


// ============================================================================
// 🧹 6. 중복 문장 방지
// ============================================================================

function appendWithoutDuplicate(
  current,
  addition
) {

  addition =
    cleanText(addition);

  if (!addition)
    return current;

  if (!current)
    return addition;

  if (current === addition)
    return current;

  if (current.includes(addition))
    return current;

  if (addition.includes(current))
    return addition;

  return current + " " + addition;

}


// ============================================================================
// 👀 7. 현재 음성 화면
// ============================================================================

function showCurrentText() {

  const finalText =
    cleanText(
      finalTranscript
    );


  const interimText =
    cleanText(
      interimTranscript
    );


  displayedTranscript =
    cleanText(
      finalText +
      (
        interimText
          ? " " + interimText
          : ""
      )
    );


  inputResult.innerHTML =

    '<div class="listening">' +
    '🎙️ 듣고 있어요...<br><br>' +
    '</div>' +

    escapeHtml(
      displayedTranscript ||
      "말씀해주세요."
    );

}


// ============================================================================
// 🎙️ 8. 음성인식 시작
// ============================================================================

function startRecognition() {

  if (
    !SpeechRecognition ||
    !recognition ||
    recognitionRunning
  ) {

    return;

  }


  try {

    recognition.start();

  } catch (error) {

    console.log(
      "recognition.start 오류:",
      error
    );

  }

}


// ============================================================================
// 🟢 9. 말하기 시작 / 이어서 말하기
// ============================================================================

startButton.addEventListener(
  "click",
  function() {

    if (
      isSending ||
      !SpeechRecognition
    ) {

      return;

    }


    currentInputMode =
      "voice";


    if (isRecording) {

      finishRequested =
        false;

      startButton.disabled =
        true;

      finishButton.disabled =
        false;


      inputResult.innerHTML =

        '<div class="listening">' +
        '🎙️ 다시 듣고 있어요...<br><br>' +
        '</div>' +

        (
          displayedTranscript
            ? escapeHtml(
                displayedTranscript
              )
            : "말씀해주세요."
        );


      startRecognition();

      return;

    }


    pendingToken =
      null;

    finalTranscript =
      "";

    interimTranscript =
      "";

    displayedTranscript =
      "";

    finishRequested =
      false;

    isRecording =
      true;

    startButton.disabled =
      true;

    finishButton.disabled =
      false;

    directButton.disabled =
      true;


    setStartButtonLabel(
      "듣는 중"
    );


    timer.textContent =
      "⏱️ 최대 30초";


    inputResult.innerHTML =
      '<div class="listening">' +
      '🎙️ 듣고 있어요...<br><br>' +
      '말씀해주세요.' +
      '</div>';


    recognition =
      new SpeechRecognition();


    recognition.lang =
      "ko-KR";

    recognition.continuous =
      true;

    recognition.interimResults =
      true;

    recognition.maxAlternatives =
      1;


    recognition.onresult =
      function(event) {

        let newFinal =
          "";

        let newInterim =
          "";


        for (
          let i = event.resultIndex;
          i < event.results.length;
          i++
        ) {

          const transcript =
            cleanText(
              event.results[i][0].transcript
            );


          if (
            event.results[i].isFinal
          ) {

            newFinal =
              appendWithoutDuplicate(
                newFinal,
                transcript
              );

          } else {

            newInterim =
              appendWithoutDuplicate(
                newInterim,
                transcript
              );

          }

        }


        if (newFinal) {

          finalTranscript =
            appendWithoutDuplicate(
              finalTranscript,
              newFinal
            );

        }


        interimTranscript =
          newInterim;


        showCurrentText();

      };


    recognition.onend =
      function() {

        recognitionRunning =
          false;


        if (
          isRecording &&
          !finishRequested
        ) {

          startButton.disabled =
            false;

          setStartButtonLabel(
            "이어서 말하기"
          );

          finishButton.disabled =
            false;


          if (displayedTranscript) {

            inputResult.innerHTML =
              escapeHtml(
                displayedTranscript
              );

          }

        }

      };


    recognition.onerror =
      function(event) {

        console.log(
          "음성인식 오류:",
          event.error
        );


        recognitionRunning =
          false;


        if (
          event.error ===
          "not-allowed"
        ) {

          inputResult.innerHTML =
            '<div class="error">' +
            '❌ 마이크 사용이 차단되었습니다.<br><br>' +
            '브라우저 주소창의 마이크 권한을 허용해주세요.' +
            '</div>';


          isRecording =
            false;

          finishRequested =
            true;

          startButton.disabled =
            false;

          setStartButtonLabel(
            "말하기 시작"
          );

          finishButton.disabled =
            true;

          directButton.disabled =
            false;

          return;

        }


        if (
          event.error === "no-speech" ||
          event.error === "aborted"
        ) {

          return;

        }

      };


    recognition.onstart =
      function() {

        recognitionRunning =
          true;

      };


    startRecognition();


    clearTimeout(
      recordingTimer
    );


    recordingTimer =
      setTimeout(
        function() {

          if (isRecording) {

            finishRecording();

          }

        },
        30000
      );

  }
);


// ============================================================================
// 🛑 10. 말하기 완료
// ============================================================================

finishButton.addEventListener(
  "click",
  function() {

    finishRecording();

  }
);


// ============================================================================
// ✏️ 10-1. 직접 입력하기
// ============================================================================

directButton.addEventListener(
  "click",
  function() {

    startDirectInput();

  }
);


async function startDirectInput() {

  if (isSending)
    return;


  currentInputMode =
    "direct";

  pendingToken =
    null;


  if (isRecording) {

    finishRecording();

    return;

  }


  isSending =
    true;


  directButton.disabled =
    true;

  startButton.disabled =
    true;

  finishButton.disabled =
    true;


  inputResult.innerHTML =
    '<div class="listening">' +
    '✏️ 직접 입력 화면을 준비하고 있어요...<br><br>' +
    '잠시만 기다려주세요.' +
    '</div>';


  try {

    const data =
      await postToGAS({
        action: "directPreview"
      });


    if (
      data.status !== "preview"
    ) {

      throw new Error(
        data.message ||
        "직접 입력 화면을 준비하지 못했습니다."
      );

    }


    pendingToken =
      data.token;


    showPreview(data);


  } catch (error) {

    console.error(error);


    inputResult.innerHTML =

      '<div class="error">' +
      '❌ 직접 입력 화면을 열지 못했어요.<br><br>' +
      escapeHtml(
        error.message ||
        String(error)
      ) +
      '</div>' +

      '<div class="button-group">' +

      '<button id="directRetryButton" ' +
      'style="background:#64748b;color:white;">' +
      '🔄 처음 화면으로' +
      '</button>' +

      '</div>';


    document
      .getElementById(
        "directRetryButton"
      )
      .addEventListener(
        "click",
        resetForNewRecording
      );


  } finally {

    isSending =
      false;

    directButton.disabled =
      false;

  }

}


// ============================================================================
// 🛑 11. 녹음 종료
// ============================================================================

function finishRecording() {

  if (!isRecording)
    return;


  isRecording =
    false;

  finishRequested =
    true;


  clearTimeout(
    recordingTimer
  );


  if (recognition) {

    try {

      recognition.stop();

    } catch (error) {

      console.log(
        "recognition.stop 오류:",
        error
      );

    }

  }


  recognitionRunning =
    false;


  startButton.disabled =
    false;

  setStartButtonLabel(
    "말하기 시작"
  );

  finishButton.disabled =
    true;

  directButton.disabled =
    false;

  timer.textContent =
    "";


  const text =
    cleanText(
      finalTranscript ||
      displayedTranscript
    );


  if (!text) {

    inputResult.innerHTML =
      '<div class="error">' +
      '❌ 음성 내용을 듣지 못했어요.<br><br>' +
      '다시 말해주세요.' +
      '</div>';

    return;

  }


  finalizeAndSend(text);

}


// ============================================================================
// 📡 12. 분석 요청
// ============================================================================

function finalizeAndSend(text) {

  if (isSending)
    return;


  isSending =
    true;


  inputResult.innerHTML =
    '<div class="listening">' +
    '🔎 음성을 분석하고 있어요...<br><br>' +
    '잠시만 기다려주세요.' +
    '</div>';


  sendAnalyzeToGAS(text);

}


// ============================================================================
// 📡 13. GAS POST 공통
// ============================================================================

async function postToGAS(payload) {

  const response =
    await fetch(
      GAS_URL,
      {
        method: "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify(payload)

      }
    );


  const raw =
    await response.text();


  console.log(
    "GAS 응답:",
    raw
  );


  let data;


  try {

    data =
      JSON.parse(raw);

  } catch (jsonError) {

    throw new Error(
      "GAS 응답을 읽지 못했습니다.\n\n" +
      raw
    );

  }


  return data;

}


// ============================================================================
// 📡 14. GAS 분석 요청
// ============================================================================

async function sendAnalyzeToGAS(text) {

  try {

    const data =
      await postToGAS({
        action: "analyze",
        text: text
      });


    if (
      data.status !== "preview"
    ) {

      throw new Error(
        data.message ||
        "음성 분석에 실패했습니다."
      );

    }


    pendingToken =
      data.token;


    showPreview(data);


  } catch (error) {

    console.error(error);


    inputResult.innerHTML =

      '<div class="error">' +
      '❌ 분석하지 못했어요.<br><br>' +
      escapeHtml(
        error.message ||
        String(error)
      ) +
      '</div>' +

      '<div class="button-group">' +

      '<button id="analyzeRetryButton" ' +
      'style="background:#64748b;color:white;">' +
      '❌ 다시 말하기' +
      '</button>' +

      '</div>';


    document
      .getElementById(
        "analyzeRetryButton"
      )
      .addEventListener(
        "click",
        resetForNewRecording
      );


  } finally {

    isSending =
      false;

  }

}


// ============================================================================
// 📋 15. 초기 거래처 / 제품 / Select 목록
// ============================================================================

async function loadInitialData() {

  try {

    const data =
      await postToGAS({
        action: "initialData"
      });


    if (
      data.status !== "success"
    ) {

      throw new Error(
        data.message ||
        "초기 데이터를 가져오지 못했습니다."
      );

    }


    clientList =
      Array.isArray(data.clients)
        ? data.clients.slice()
        : [];


    productList =
      Array.isArray(data.products)
        ? data.products.slice()
        : [];


    deliveryTypeList =
      Array.isArray(data.deliveryTypes)
        ? data.deliveryTypes
        : [];


    secondDeliveryLocationList =
      Array.isArray(
        data.secondDeliveryLocations
      )
        ? data.secondDeliveryLocations
        : [];


    clientList.sort(
      function(a, b) {

        return String(
          a.name || ""
        ).localeCompare(
          String(
            b.name || ""
          ),
          "ko"
        );

      }
    );


    productList =
      sortProductsByRequestedOrder(
        productList
      );


    console.log(
      "거래처 수:",
      clientList.length
    );


    console.log(
      "제품 수:",
      productList.length
    );


    console.log(
      "납품형태 옵션:",
      deliveryTypeList
    );


    console.log(
      "제2배송지 옵션:",
      secondDeliveryLocationList
    );


  } catch (error) {

    console.error(
      "초기 데이터 오류:",
      error
    );


    inputResult.innerHTML =
      '<div class="error">' +
      '❌ 거래처 / 제품 목록을 가져오지 못했습니다.<br><br>' +
      escapeHtml(
        error.message ||
        String(error)
      ) +
      '</div>';

  }

}


// ============================================================================
// 📋 15-1. 제품 표시 순서
// ============================================================================

function sortProductsByRequestedOrder(
  products
) {

  const order = {

    "15 KG": 0,

    "20 KG": 1,

    "12 KG": 2

  };


  return products
    .slice()
    .sort(
      function(a, b) {

        const aSize =
          getProductSize(
            a.name
          );


        const bSize =
          getProductSize(
            b.name
          );


        const ai =
          Object.prototype
            .hasOwnProperty
            .call(
              order,
              aSize
            )
              ? order[aSize]
              : 99;


        const bi =
          Object.prototype
            .hasOwnProperty
            .call(
              order,
              bSize
            )
              ? order[bSize]
              : 99;


        if (
          ai !== bi
        ) {

          return ai - bi;

        }


        return String(
          a.name || ""
        ).localeCompare(
          String(
            b.name || ""
          ),
          "ko"
        );

      }
    );

}


// ============================================================================
// 📏 15-2. 제품명에서 규격 찾기
// ============================================================================

function getProductSize(
  productName
) {

  const text =
    String(
      productName || ""
    );


  if (
    /12\s*KG/i.test(text)
  )
    return "12 KG";


  if (
    /15\s*KG/i.test(text)
  )
    return "15 KG";


  if (
    /20\s*KG/i.test(text)
  )
    return "20 KG";


  return "";

}


// ============================================================================
// 🚚 15-3. 납품형태 정규화
// ============================================================================
//
// ⭐⭐⭐⭐⭐ 중요 ⭐⭐⭐⭐⭐
//
// 이 부분은 기존 정상화 코드를 그대로 유지합니다.
//
// GAS가 다음처럼 반환해도:
//
//   "택배"
//   "택배 발송"
//   "택배배송"
//   "택배 배송"
//   "택배로"
//   "택배로 발송"
//
// 실제 Select에 존재하는 "택배" 계열 옵션을 찾아 선택합니다.
//
// 택배 의미가 없으면 실제 Select의 "직송"을 기본값으로 사용합니다.
//
// ============================================================================

function normalizeDeliveryType(
  value,
  options
) {

  const list =
    Array.isArray(options)
      ? options
      : [];


  const raw =
    cleanText(value);


  // --------------------------------------------------------------------------
  // ① 완전 일치
  // --------------------------------------------------------------------------

  const exact =
    list.find(
      function(option) {

        return cleanText(option) === raw;

      }
    );


  if (exact) {

    return exact;

  }


  // --------------------------------------------------------------------------
  // ② 택배 관련 표현
  // --------------------------------------------------------------------------

  const compact =
    raw
      .toLowerCase()
      .replace(/\s+/g, "");


  const isParcel =
    compact.includes("택배") ||
    compact.includes("택배발송") ||
    compact.includes("택배송");


  if (isParcel) {

    const parcelOption =
      list.find(
        function(option) {

          const optionCompact =
            cleanText(option)
              .toLowerCase()
              .replace(/\s+/g, "");


          return optionCompact.includes(
            "택배"
          );

        }
      );


    if (parcelOption) {

      return parcelOption;

    }

  }


  // --------------------------------------------------------------------------
  // ③ 직송 찾기
  // --------------------------------------------------------------------------

  const directOption =
    list.find(
      function(option) {

        const optionCompact =
          cleanText(option)
            .toLowerCase()
            .replace(/\s+/g, "");


        return optionCompact === "직송";

      }
    );


  // --------------------------------------------------------------------------
  // ④ 직송이 있으면 직송
  // --------------------------------------------------------------------------

  if (directOption) {

    return directOption;

  }


  // --------------------------------------------------------------------------
  // ⑤ 안전 기본값
  // --------------------------------------------------------------------------

  return "직송";

}


// ============================================================================
// 🚚 15-4. 납품형태 Select 옵션 생성
// ============================================================================

function buildDeliveryTypeOptions(
  selectedDeliveryType
) {

  const selected =
    normalizeDeliveryType(
      selectedDeliveryType,
      deliveryTypeList
    );


  const options =
    Array.isArray(deliveryTypeList) &&
    deliveryTypeList.length > 0
      ? deliveryTypeList
      : ["직송"];


  return options
    .map(
      function(option) {

        const isSelected =
          cleanText(option) ===
          cleanText(selected);


        return (

          '<option value="' +
            escapeAttribute(
              option
            ) +
          '"' +

          (
            isSelected
              ? " selected"
              : ""
          ) +

          '>' +

          escapeHtml(
            option
          ) +

          '</option>'

        );

      }
    )
    .join("");

}

// ============================================================================
// 🏢 16-1. 거래처 검색 / 후보 선택
// ============================================================================

function setupClientSearch(
  initialClientId
) {

  const input =
    document.getElementById(
      "clientSearchInput"
    );


  const candidates =
    document.getElementById(
      "clientCandidates"
    );


  const selectedBox =
    document.getElementById(
      "selectedClient"
    );


  const clientSelect =
    document.getElementById(
      "clientSelect"
    );


  if (
    !input ||
    !candidates ||
    !selectedBox ||
    !clientSelect
  ) {

    return;

  }


  function normalizeSearchText(
    value
  ) {

    return String(
      value || ""
    )
      .toLowerCase()
      .replace(
        /\s+/g,
        ""
      )
      .trim();

  }


  function selectClient(
    client
  ) {

    clientSelect.value =
      client.id;


    input.value =
      client.name;


    selectedBox.style.display =
      "block";


    selectedBox.innerHTML =
      "✅ 선택된 거래처: " +
      escapeHtml(
        client.name
      );


    candidates.innerHTML =
      "";

  }


  function renderCandidates() {

    const keyword =
      normalizeSearchText(
        input.value
      );


    if (!keyword) {

      candidates.innerHTML =
        '<div class="candidate-empty">' +
        '🔍 거래처 이름 일부를 입력하면 후보가 나타납니다.' +
        '</div>';

      return;

    }


    const matches =
      clientList.filter(
        function(client) {

          return normalizeSearchText(
            client.name
          ).includes(
            keyword
          );

        }
      );


    if (
      matches.length === 0
    ) {

      candidates.innerHTML =
        '<div class="candidate-empty">' +
        '찾는 거래처가 없습니다. 다른 검색어를 입력해보세요.' +
        '</div>';

      return;

    }


    candidates.innerHTML =
      matches
        .map(
          function(client) {

            return (

              '<button ' +
              'type="button" ' +
              'class="candidate-item" ' +
              'data-client-id="' +
              escapeAttribute(
                client.id
              ) +
              '">' +

              '🏢 ' +

              escapeHtml(
                client.name
              ) +

              '</button>'

            );

          }
        )
        .join("");


    candidates
      .querySelectorAll(
        ".candidate-item"
      )
      .forEach(
        function(button) {

          button.addEventListener(
            "click",
            function() {

              const client =
                clientList.find(
                  function(item) {

                    return String(
                      item.id
                    ) ===
                    String(
                      button.getAttribute(
                        "data-client-id"
                      )
                    );

                  }
                );


              if (client) {

                selectClient(
                  client
                );

              }

            }
          );

        }
      );

  }


  input.addEventListener(
    "input",
    function() {

      clientSelect.value =
        "";


      selectedBox.style.display =
        "none";


      renderCandidates();

    }
  );


  input.addEventListener(
    "focus",
    function() {

      if (input.value) {

        renderCandidates();

      }

    }
  );


  clientSelect.addEventListener(
    "change",
    function() {

      const selectedId =
        clientSelect.value;


      if (!selectedId) {

        selectedBox.style.display =
          "none";

        return;

      }


      const client =
        clientList.find(
          function(item) {

            return String(
              item.id
            ) ===
            String(
              selectedId
            );

          }
        );


      if (client) {

        selectClient(
          client
        );

      }

    }
  );


  if (initialClientId) {

    const initialClient =
      clientList.find(
        function(item) {

          return String(
            item.id
          ) ===
          String(
            initialClientId
          );

        }
      );


    if (initialClient) {

      selectClient(
        initialClient
      );

    }

  } else {

    renderCandidates();

  }

}

// ============================================================================
// 📅 16-3. 오늘 날짜
// ============================================================================

function getTodayLocal() {

  const now =
    new Date();


  const y =
    now.getFullYear();


  const m =
    String(
      now.getMonth() + 1
    ).padStart(
      2,
      "0"
    );


  const d =
    String(
      now.getDate()
    ).padStart(
      2,
      "0"
    );


  return (
    y +
    "-" +
    m +
    "-" +
    d
  );

}

// 🔐 17. 사용자가 최종 확인 → Notion 등록
// ============================================================================

async function confirmNotionRegistration() {

  if (!pendingToken) {

    previewResult.innerHTML =
      '<div class="error">' +
      '❌ 확인 시간이 만료되었어요.<br><br>' +
      '다시 입력해주세요.' +
      '</div>';

    return;

  }


  if (isSending)
    return;


  const clientSelect =
    document.getElementById(
      "clientSelect"
    );


  const productSelect =
    document.getElementById(
      "productSelect"
    );


  const quantityInput =
    document.getElementById(
      "quantityInput"
    );


  const modeSelect =
    document.getElementById(
      "modeSelect"
    );


  const deliveryDateInput =
    document.getElementById(
      "deliveryDateInput"
    );


  const sizeInput =
    document.getElementById(
      "sizeInput"
    );


  const deliveryTypeSelect =
    document.getElementById(
      "deliveryTypeSelect"
    );


  const secondDeliverySelect =
    document.getElementById(
      "secondDeliverySelect"
    );


  if (
    !clientSelect ||
    !productSelect ||
    !quantityInput ||
    !modeSelect ||
    !deliveryDateInput ||
    !sizeInput ||
    !deliveryTypeSelect ||
    !secondDeliverySelect
  ) {

    previewResult.innerHTML =
      '<div class="error">' +
      '❌ 등록 화면을 읽지 못했습니다.<br><br>' +
      '다시 입력해주세요.' +
      '</div>';

    return;

  }


  const clientPageId =
    clientSelect.value;


  const productPageId =
    productSelect.value;


  const quantity =
    Number(
      quantityInput.value
    );


  const mode =
    modeSelect.value;


  const deliveryDate =
    deliveryDateInput.value;


  const size =
    sizeInput.value;


  // ========================================================================
  // 🚚 납품형태
  // ========================================================================

  const deliveryType =
    deliveryTypeSelect.value;


  const secondDeliveryLocation =
    secondDeliverySelect.value;


  if (!clientPageId) {

    alert(
      "거래처를 선택해주세요."
    );

    clientSelect.focus();

    return;

  }


  if (!productPageId) {

    alert(
      "제품을 선택해주세요."
    );

    productSelect.focus();

    return;

  }


  if (
    !Number.isInteger(
      quantity
    ) ||
    quantity <= 0
  ) {

    alert(
      "수량은 1박스 이상의 정수로 입력해주세요."
    );

    quantityInput.focus();

    return;

  }


  if (
    mode !== "입고" &&
    mode !== "출고"
  ) {

    alert(
      "입고 또는 출고를 선택해주세요."
    );

    modeSelect.focus();

    return;

  }


  if (
    !/^\d{4}-\d{2}-\d{2}$/.test(
      deliveryDate
    )
  ) {

    alert(
      "납품요청일을 선택해주세요."
    );

    deliveryDateInput.focus();

    return;

  }


  if (
    size !== "12 KG" &&
    size !== "15 KG" &&
    size !== "20 KG"
  ) {

    alert(
      "제품 규격을 확인해주세요."
    );

    return;

  }


  if (!deliveryType) {

    alert(
      "납품형태를 선택해주세요."
    );

    deliveryTypeSelect.focus();

    return;

  }


  isSending =
    true;


  const confirmButton =
    document.getElementById(
      "confirmButton"
    );


  const retryButton =
    document.getElementById(
      "retryButton"
    );


  if (confirmButton) {

    confirmButton.disabled =
      true;

    confirmButton.textContent =
      "⏳ 노션에 등록 중...";

  }


  if (retryButton) {

    retryButton.disabled =
      true;

  }


  previewResult.innerHTML =
    '<div class="listening">' +
    '📝 노션에 등록하고 있어요...<br><br>' +
    '잠시만 기다려주세요.' +
    '</div>';


  try {

    const data =
      await postToGAS({

        action:
          "confirm",

        token:
          pendingToken,

        clientPageId:
          clientPageId,

        productPageId:
          productPageId,

        quantity:
          quantity,

        mode:
          mode,

        size:
          size,

        deliveryDate:
          deliveryDate,

        deliveryType:
          deliveryType,

        secondDeliveryLocation:
          secondDeliveryLocation

      });


    if (
      data.status !==
      "success"
    ) {

      throw new Error(
        data.message ||
        "Notion 등록에 실패했습니다."
      );

    }


    pendingToken =
      null;


    previewResult.innerHTML =

      '<div class="step-indicator">' +

        '<div class="step-dot">' +
          '1' +
        '</div>' +

        '<div class="step-line"></div>' +

        '<div class="step-dot">' +
          '2' +
        '</div>' +

        '<div class="step-line"></div>' +

        '<div class="step-dot active">' +
          '3' +
        '</div>' +

      '</div>' +


      '<div class="preview-step" ' +
      'style="margin-bottom:8px;">' +
        'STEP 3 · 완료' +
      '</div>' +


      '<div class="success">' +
        '🎉 노션 등록 완료!' +
      '</div>' +

      '<br>' +

      '<strong>' +
        escapeHtml(
          data.clientName
        ) +
      '</strong>' +

      ' / ' +

      escapeHtml(
        data.productName
      ) +

      ' / ' +

      escapeHtml(
        String(
          data.quantity
        ) +
        "박스"
      ) +

      ' / ' +

      escapeHtml(
        data.mode
      ) +

      '<br><br>' +

      '📏 규격: ' +
      escapeHtml(
        data.size
      ) +

      '<br>' +

      '📅 납품요청일: ' +
      escapeHtml(
        data.deliveryDate
      ) +

      '<br>' +

      '🚚 납품형태: ' +
      escapeHtml(
        data.deliveryType ||
        ''
      ) +

      '<br>' +

      '📍 제2배송지: ' +
      escapeHtml(
        data.secondDeliveryLocation ||
        '없음'
      );


    if (data.notionUrl) {

      previewResult.innerHTML +=

        '<br><br>' +

        '<a ' +
        'href="' +
        escapeAttribute(
          data.notionUrl
        ) +
        '" ' +
        'target="_blank" ' +
        'style="font-size:16px;"' +
        '>' +

        '🔗 노션 페이지 열기' +

        '</a>';

    }


    previewResult.innerHTML +=

      '<div class="button-group">' +

        '<button ' +
        'id="newRecordButton" ' +
        'style="background:#111827;color:white;"' +
        '>' +

        '🎙️ 새 입출고 입력' +

        '</button>' +

      '</div>';


    document
      .getElementById(
        "newRecordButton"
      )
      .addEventListener(
        "click",
        resetForNewRecording
      );


  } catch (error) {

    console.error(
      error
    );


    previewResult.innerHTML =

      '<div class="error">' +
      '❌ 노션 등록에 실패했어요.<br><br>' +
      escapeHtml(
        error.message ||
        String(error)
      ) +
      '</div>' +

      '<div class="button-group">' +

      '<button id="confirmRetryButton" ' +
      'style="background:#64748b;color:white;">' +
      '🔄 다시 입력' +
      '</button>' +

      '</div>';


    document
      .getElementById(
        "confirmRetryButton"
      )
      .addEventListener(
        "click",
        resetForNewRecording
      );


  } finally {

    isSending =
      false;

  }

}

// 🔄 18. 새 입력 준비

function resetForNewRecording() {

  clearTimeout(
    recordingTimer
  );


  if (recognition) {

    try {

      recognition.stop();

    } catch (error) {

      console.log(
        error
      );

    }

  }


  isRecording =
    false;

  finishRequested =
    true;

  recognitionRunning =
    false;

  finalTranscript =
    "";

  interimTranscript =
    "";

  displayedTranscript =
    "";

  pendingToken =
    null;

  isSending =
    false;

  currentInputMode =
    "voice";


  startButton.disabled =
    false;

  setStartButtonLabel(
    "말하기 시작"
  );

  finishButton.disabled =
    true;

  directButton.disabled =
    false;

  timer.textContent =
    "";


  inputResult.innerHTML =
    "버튼을 누르고 말씀해주세요.";


  showInputScreen();

}


// ============================================================================
// 🛡️ 19. HTML 안전 처리
// ============================================================================

function escapeHtml(
  value
) {

  return String(
    value == null
      ? ""
      : value
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeAttribute(
  value
) {

  return escapeHtml(
    value
  );

}

// ============================================================================

loadInitialData();
