```html
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>푸로찜 에스 음성 입출고</title>

    <style>

            font-family: sans-serif;

            color: #1565c0;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>🎙️ 푸로찜 에스<br>음성 입출고 시스템</h1>

    <button id="start-btn">
        🗣️ 말하기 시작
    </button>

    <button id="stop-btn" disabled>
        🛑 말하기 완료
    </button>

    <div id="result">
        버튼을 누르고 말씀하세요.
    </div>


<script>

    // =========================================================
    // ⭐ 사장님의 GAS 웹 앱 주소
    // =========================================================

    const GAS_URL =
        "https://script.google.com/macros/s/AKfycbwLaMpc6dRijqMpkSDDykr30bD-OY--hYA0mLwS7tEud61aZ-D_jFF2kFGbpMSLCDM/exec";


    // =========================================================
    // ⭐ 음성 입력 최대 시간
    // =========================================================
    //
    // 사장님이 직접 "말하기 완료"를 누르지 않아도
    // 최대 30초가 지나면 자동으로 마무리합니다.
    //
    // 평소에는 30초까지 기다리지 않습니다.
    // 사장님이 완료 버튼을 누르면 바로 끝납니다.
    //
    // =========================================================

    const MAX_RECORDING_TIME = 30000;


    // =========================================================
    // 화면 요소
    // =========================================================

    const startBtn =
        document.getElementById("start-btn");

    const stopBtn =
        document.getElementById("stop-btn");

    const resultDiv =
        document.getElementById("result");


    // =========================================================
    // 휴대폰 음성인식 기능 확인
    // =========================================================

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

        resultDiv.className = "error";

        resultDiv.innerText =
            "❌ 이 브라우저는 음성 인식을 지원하지 않습니다.\n\n" +
            "휴대폰에서는 Chrome을 사용해주세요.";

    } else {


        // =====================================================
        // 🎤 음성인식 객체
        // =====================================================

        const recognition =
            new SpeechRecognition();


        // 한국어
        recognition.lang =
            "ko-KR";


        // =====================================================
        // ⭐ 핵심 설정
        // =====================================================
        //
        // 한 문장만 듣고 바로 끝내지 않도록 합니다.
        //
        // 단,
        // 브라우저가 자체적으로 음성인식을 종료하는 경우에는
        // 필요한 경우에만 다시 연결합니다.
        //
        // =====================================================

        recognition.continuous =
            true;

        recognition.interimResults =
            true;

        recognition.maxAlternatives =
            1;


        // =====================================================
        // ⭐ 상태 변수
        // =====================================================

        // 현재 사용자가 말하고 있는 중인가?
        let isRecording =
            false;


        // 사용자가 "말하기 완료"를 눌렀는가?
        let finishRequested =
            false;


        // 현재 음성인식 세션이 실제로 실행 중인가?
        let recognitionRunning =
            false;


        // 최종 확정된 문장
        let finalTranscript =
            "";


        // 현재 인식 중인 임시 문장
        let interimTranscript =
            "";


        // 마지막으로 화면에 보여준 전체 문장
        let displayedTranscript =
            "";


        // 최대 녹음 시간 타이머
        let recordingTimer =
            null;


        // 음성인식 재시작 타이머
        let restartTimer =
            null;


        // GAS 중복 전송 방지
        let isSending =
            false;


        // =====================================================
        // 🧹 공백 정리 함수
        // =====================================================

        function cleanText(text) {

            return String(text || "")
                .replace(/\s+/g, " ")
                .trim();

        }


        // =====================================================
        // 🧹 중복 문장 방지 함수
        // =====================================================
        //
        // 브라우저가 같은 결과를 다시 보내는 경우
        // 똑같은 문장이 두 번 붙지 않도록 합니다.
        //
        // =====================================================

        function appendWithoutDuplicate(
            base,
            addition
        ) {

            base =
                cleanText(base);

            addition =
                cleanText(addition);


            if (!addition) {
                return base;
            }


            if (!base) {
                return addition;
            }


            // 완전히 같은 경우
            if (base === addition) {
                return base;
            }


            // 이미 base의 끝부분에 들어있는 경우
            if (base.endsWith(addition)) {
                return base;
            }


            // addition의 앞부분이 base의 끝부분과
            // 겹치는 경우를 찾아 중복 제거
            const maxOverlap =
                Math.min(
                    base.length,
                    addition.length
                );


            for (
                let length = maxOverlap;
                length >= 2;
                length--
            ) {

                const baseEnd =
                    base.slice(
                        -length
                    );

                const additionStart =
                    addition.slice(
                        0,
                        length
                    );


                if (
                    baseEnd ===
                    additionStart
                ) {

                    return cleanText(
                        base +
                        " " +
                        addition.slice(length)
                    );

                }

            }


            return cleanText(
                base +
                " " +
                addition
            );

        }


        // =====================================================
        // 📺 현재 텍스트 화면 표시
        // =====================================================

        function showCurrentText() {

            const combined =
                cleanText(
                    finalTranscript +
                    " " +
                    interimTranscript
                );


            displayedTranscript =
                combined;


            if (!combined) {

                resultDiv.className =
                    "listening";

                resultDiv.innerText =
                    "🎧 듣고 있어요...\n\n" +
                    "편하게 말씀하세요.\n\n" +
                    "중간에 잠깐 멈춰도 괜찮습니다.";

                return;
            }


            resultDiv.className =
                "listening";

            resultDiv.innerText =
                "🎧 듣고 있어요...\n\n" +
                "🗣️ " +
                combined +
                "\n\n" +
                "다 말씀하셨으면\n" +
                "🛑 「말하기 완료」를 눌러주세요.";

        }


        // =====================================================
        // 🎤 음성인식 시작
        // =====================================================

        function startRecognition() {

            if (!isRecording) {
                return;
            }


            if (finishRequested) {
                return;
            }


            if (recognitionRunning) {
                return;
            }


            try {

                recognitionRunning =
                    true;

                recognition.start();

                console.log(
                    "🎤 음성인식 시작"
                );

            } catch (error) {

                recognitionRunning =
                    false;

                console.log(
                    "음성인식 시작 무시:",
                    error
                );

            }

        }


        // =====================================================
        // 🗣️ 말하기 시작
        // =====================================================

        startBtn.addEventListener(
            "click",
            () => {

                if (isRecording) {
                    return;
                }


                // 상태 초기화
                isRecording =
                    true;

                finishRequested =
                    false;

                recognitionRunning =
                    false;

                finalTranscript =
                    "";

                interimTranscript =
                    "";

                displayedTranscript =
                    "";

                isSending =
                    false;


                // 기존 타이머 제거
                clearTimeout(
                    recordingTimer
                );

                clearTimeout(
                    restartTimer
                );


                // 버튼 상태
                startBtn.disabled =
                    true;

                stopBtn.disabled =
                    false;

                startBtn.innerText =
                    "🎧 듣고 있어요...";


                resultDiv.className =
                    "listening";

                resultDiv.innerText =
                    "🎧 듣고 있어요...\n\n" +
                    "편하게 말씀하세요.\n" +
                    "중간에 잠깐 멈춰도 괜찮습니다.\n\n" +
                    "다 말씀하신 후\n" +
                    "🛑 「말하기 완료」를 눌러주세요.";


                // =================================================
                // ⭐ 최대 30초 안전장치
                // =================================================

                recordingTimer =
                    setTimeout(
                        () => {

                            if (
                                isRecording
                            ) {

                                finishRecording();

                            }

                        },
                        MAX_RECORDING_TIME
                    );


                // 음성인식 시작
                startRecognition();

            }
        );


        // =====================================================
        // 🛑 말하기 완료
        // =====================================================

        stopBtn.addEventListener(
            "click",
            () => {

                finishRecording();

            }
        );


        // =====================================================
        // 🛑 최종 음성 입력 종료
        // =====================================================

        function finishRecording() {

            if (!isRecording) {
                return;
            }


            // 완료 요청
            finishRequested =
                true;

            isRecording =
                false;


            // 타이머 제거
            clearTimeout(
                recordingTimer
            );

            clearTimeout(
                restartTimer
            );


            // 화면
            resultDiv.className =
                "";

            resultDiv.innerText =
                "⏳ 말씀을 정리하는 중입니다...";


            // 더 이상 새 음성인식 시작 금지
            try {

                if (
                    recognitionRunning
                ) {

                    recognition.stop();

                }

            } catch (error) {

                console.log(
                    "음성인식 종료:",
                    error
                );

            }


            /*
             * 음성인식이 이미 종료된 상태에서
             * 완료 버튼을 눌렀다면
             * onend가 호출되지 않을 수 있습니다.
             *
             * 그래서 아주 짧게 기다린 후
             * 현재까지 확보한 최종 문장을 확인합니다.
             */

            setTimeout(
                () => {

                    if (
                        finishRequested &&
                        !isSending
                    ) {

                        finalizeAndSend();

                    }

                },
                700
            );

        }


        // =====================================================
        // 📝 최종 문장 확정 후 GAS 전송
        // =====================================================

        function finalizeAndSend() {

            if (isSending) {
                return;
            }


            isSending =
                true;


            // 최종 문장
            let text =
                cleanText(
                    finalTranscript
                );


            /*
             * 혹시 마지막 순간에 final로 확정되지 않고
             * interim으로 남아 있다면
             * 그것도 마지막 안전장치로 포함합니다.
             */

            if (
                interimTranscript
            ) {

                text =
                    appendWithoutDuplicate(
                        text,
                        interimTranscript
                    );

            }


            // 그래도 비어 있으면
            if (!text) {

                isSending =
                    false;

                startBtn.disabled =
                    false;

                stopBtn.disabled =
                    true;

                startBtn.innerText =
                    "🗣️ 다시 말하기";

                resultDiv.className =
                    "error";

                resultDiv.innerText =
                    "❌ 음성 내용이 없습니다.\n\n" +
                    "다시 말씀해주세요.";

                return;
            }


            // 임시 결과 초기화
            interimTranscript =
                "";


            // 최종 화면
            resultDiv.className =
                "";

            resultDiv.innerText =
                "📝 최종 음성 내용\n\n" +
                text +
                "\n\n" +
                "📤 Google 시트로 보내는 중...";


            // GAS 전송
            sendToGAS(text);

        }


        // =====================================================
        // 🎤 음성 인식 결과
        // =====================================================

        recognition.onresult =
            (event) => {

                if (
                    !isRecording &&
                    !finishRequested
                ) {
                    return;
                }


                let newFinalText =
                    "";

                let newInterimText =
                    "";


                /*
                 * ⭐ 매우 중요
                 *
                 * event.resultIndex부터만 읽습니다.
                 *
                 * 이전 결과를 매번 다시 합치지 않아서
                 * 중복되는 문제를 줄입니다.
                 */

                for (
                    let i = event.resultIndex;
                    i < event.results.length;
                    i++
                ) {

                    const transcript =
                        cleanText(
                            event.results[i][0].transcript
                        );


                    if (!transcript) {
                        continue;
                    }


                    if (
                        event.results[i].isFinal
                    ) {

                        newFinalText =
                            appendWithoutDuplicate(
                                newFinalText,
                                transcript
                            );

                    } else {

                        newInterimText =
                            appendWithoutDuplicate(
                                newInterimText,
                                transcript
                            );

                    }

                }


                // 최종 문장에 추가
                if (
                    newFinalText
                ) {

                    finalTranscript =
                        appendWithoutDuplicate(
                            finalTranscript,
                            newFinalText
                        );

                }


                // 임시 문장은 현재 세션의 임시 결과
                interimTranscript =
                    newInterimText;


                showCurrentText();

            };


        // =====================================================
        // 🎤 음성인식 종료
        // =====================================================

        recognition.onend =
            () => {

                recognitionRunning =
                    false;


                console.log(
                    "🎤 음성인식 세션 종료"
                );


                // 사용자가 완료한 경우
                if (
                    finishRequested
                ) {

                    /*
                     * finishRecording()의
                     * 안전 타이머가 최종 전송을 담당합니다.
                     */

                    return;

                }


                // 녹음 중이 아니라면 종료
                if (
                    !isRecording
                ) {

                    return;

                }


                /*
                 * ⭐⭐⭐ 핵심 ⭐⭐⭐
                 *
                 * 브라우저가 잠깐의 침묵 때문에
                 * 음성인식을 끝내는 경우가 있습니다.
                 *
                 * 이때 기존 텍스트를 삭제하지 않습니다.
                 *
                 * 그리고 바로 재시작하지 않고
                 * 600ms 정도 기다립니다.
                 *
                 * 이렇게 해야 start()가 연속으로 호출되어
                 * 브라우저가 이상하게 동작하는 것을 줄일 수 있습니다.
                 */

                resultDiv.className =
                    "listening";

                resultDiv.innerText =
                    "🎧 계속 듣고 있어요...\n\n" +
                    (
                        displayedTranscript ||
                        "편하게 이어서 말씀하세요."
                    );


                clearTimeout(
                    restartTimer
                );


                restartTimer =
                    setTimeout(
                        () => {

                            if (
                                isRecording &&
                                !finishRequested &&
                                !recognitionRunning
                            ) {

                                startRecognition();

                            }

                        },
                        600
                    );

            };


        // =====================================================
        // ❌ 음성인식 오류
        // =====================================================

        recognition.onerror =
            (event) => {

                console.log(
                    "🎤 음성인식 오류:",
                    event.error
                );


                /*
                 * no-speech
                 *
                 * 말을 잠깐 하지 않았다는 의미입니다.
                 *
                 * 이것을 치명적인 오류로 처리하지 않습니다.
                 */

                if (
                    event.error ===
                    "no-speech"
                ) {

                    if (
                        isRecording &&
                        !finishRequested
                    ) {

                        resultDiv.className =
                            "listening";

                        resultDiv.innerText =
                            "🎧 계속 듣고 있어요...\n\n" +
                            (
                                displayedTranscript ||
                                "편하게 이어서 말씀하세요."
                            );

                    }

                    return;
                }


                /*
                 * aborted
         *
         * 브라우저가 음성인식을 종료하면서
         * 발생할 수 있습니다.
         *
         * 이 경우 onend에서 필요한 경우
         * 다시 연결합니다.
         */

                if (
                    event.error ===
                    "aborted"
                ) {

                    return;
                }


                /*
                 * 네트워크나 권한 등
                 * 실제 문제가 발생한 경우
                 */

                if (
                    isRecording &&
                    !finishRequested
                ) {

                    isRecording =
                        false;

                    finishRequested =
                        true;

                    clearTimeout(
                        recordingTimer
                    );

                    clearTimeout(
                        restartTimer
                    );


                    startBtn.disabled =
                        false;

                    stopBtn.disabled =
                        true;

                    startBtn.innerText =
                        "🗣️ 다시 말하기";


                    resultDiv.className =
                        "error";

                    resultDiv.innerText =
                        "❌ 음성 인식 오류\n\n" +
                        event.error;

                }

            };

    }


    // =========================================================
    // ⭐ GAS로 음성내용 보내기
    // =========================================================

    function sendToGAS(text) {


        resultDiv.className =
            "";

        resultDiv.innerText =
            "📝 최종 음성 내용\n\n" +
            text +
            "\n\n" +
            "📤 Google 시트로 보내는 중...";


        /*
         * 중요!
         *
         * 기존 정상 작동 방식 그대로 유지합니다.
         *
         * application/json을 사용하지 않고
         * text/plain으로 보냅니다.
         */

        fetch(
            GAS_URL,
            {

                method: "POST",

                headers: {
                    "Content-Type":
                        "text/plain;charset=utf-8"
                },

                body: JSON.stringify({
                    text: text
                })

            }
        )

        .then(
            response => {

                return response.text();

            }
        )

        .then(
            data => {

                console.log(
                    "GAS 응답:",
                    data
                );


                resultDiv.className =
                    "success";


                resultDiv.innerText =
                    "✅ 전송 성공!\n\n" +
                    "🗣️ " +
                    text +
                    "\n\n" +
                    "📊 Google 시트에 저장을 요청했습니다.";


                startBtn.disabled =
                    false;

                stopBtn.disabled =
                    true;

                startBtn.innerText =
                    "🗣️ 다시 말하기";

            }
        )

        .catch(
            error => {

                console.error(
                    "GAS 전송 오류:",
                    error
                );


                resultDiv.className =
                    "error";


                resultDiv.innerText =
                    "⚠️ 전송 결과를 확인하지 못했습니다.\n\n" +
                    "잠시 후 Google 시트를 확인해주세요.";


                startBtn.disabled =
                    false;

                stopBtn.disabled =
                    true;

                startBtn.innerText =
                    "🗣️ 다시 말하기";

            }
        );

    }

</script>

</body>
</html>
